ey is unique and the Autopilot's features work in harmony to give you the best sleep experience possible, every night. It learns about your preferences, your health and sleep habits and makes automatic temperature adjustments to improve your sleep over time. It also delivers on-going insights about your sleep to show how you've been progressing as well as tips to continue improving your sleep fitness.\",\"line3\":\"An Autopilot Plan is required for the first 12 months (cancel any time), and covers two separate users per Pod.\"},\"question\":\"Why do I need an Autopilot Plan?\"}},\"podProspecting\":{\"autopilot\":{\"answer\":\"It's the AI that runs your Pod. It learns how you sleep and adjusts temperature, elevation, and more — automatically, every night.\",\"question\":\"What's Autopilot?\"},\"differentTemps\":{\"answer\":\"That's exactly what the Pod is for. Each side adjusts independently from 55°F to 110°F.\",\"question\":\"What if my partner and I want different temperatures?\"},\"fitsMattress\":{\"answer\":\"Yes. The Pod Cover fits over any mattress like a fitted sheet. Keep your mattress, your frame, your sheets.\",\"question\":\"Does it work on my mattress?\"},\"hsaFsa\":{\"answer\":\"Yes. The Pod is HSA/FSA eligible.\",\"question\":\"Is it covered by HSA/FSA?\"},\"riskFree\":{\"answer\":\"Yes. You get 30 nights. If you don't love it, return it for a full refund. Free shipping both ways.\",\"question\":\"Can I try it risk-free?\"},\"vsCoolingPad\":{\"answer\":\"Cooling pads use fans that fade in hours. The Pod uses active water-based cooling that lasts all night, adjusts automatically, and works differently on each side of the bed.\",\"question\":\"How is this different from a cooling mattress pad?\"}},\"returnPolicyCover\":{\"answer\":\"If for any reason you are not happy with the Pod, you can return it within 30 days of delivery and we will fully refund both your Pod and membership purchases.\",\"question\":\"What is the return policy and what gets refunded?\"},\"returnPolicyMattress\":{\"answer\":\"If for any reason you are not happy with the Pod, you can return it within 30 days of delivery and we will fully refund both your Pod and membership purchases.\",\"question\":\"What is the return policy and what gets refunded?\"},\"sleepElixir\":{\"item1\":{\"answer\":\"Sleep Elixir was designed for adults 18+.\",\"question\":\"Who should take Sleep Elixir?\"},\"item10\":{\"answer\":\"Sleep Elixir is produced in FDA Registered and Inspected Facilities that comply with FDA 21 CFR 111 standards and are cGMP Certified. Before production, all raw materials are tested for purity and quality. Certificates of Analysis (COAs) are performed on each batch of Sleep Elixir to ensure the final product meets high standards, including testing for heavy metals, microbes, allergens, and contaminants.\",\"question\":\"What testing do you do on Sleep Elixir?\"},\"item2\":{\"answer\":\"For best results, take Sleep Elixir 60-30 minutes before bed.\",\"question\":\"When should I take Sleep Elixir?\"},\"item3\":{\"answer\":\"No, Sleep Elixir is not habit-forming and does not create a dependency. It supports healthy sleep patterns without leading to addiction or withdrawal effects.\",\"question\":\"Is Sleep Elixir habit-forming or addictive?\"},\"item4\":{\"answer\":\"Sleep Elixir may interact with prescription sleep medications, sedatives and antidepressants among others. Always consult your healthcare professional if you're taking other medications or supplements.\",\"question\":\"Can I take Sleep Elixir with other medications or supplements?\"},\"item5\":{\"answer\":\"It is not advisable to take Sleep Elixir while pregnant or lactating. For more specific advice, please consult with your healthcare provider.\",\"question\":\"Can I take Sleep Elixir while pregnant or lactating?\"},\"item6\":{\"answer\":\"Always consult your health care practitioner before using any dietary supplement if you are pregnant or nursing, using medications or have a medical condition.\",\"question\":\"Can I take Sleep Elixir if I have a sleep disorder?\"},\"item7\":{\"answer\":\"Sleep Elixir is suitable for most individuals. However, if you have specific dietary restrictions or allergies, always consult your healthcare professional before use.\",\"question\":\"Can I take Sleep Elixir if I have allergies or dietary restrictions?\"},\"item8\":{\"answer\":\"Yes, Sleep Elixir is safe for long-term use. It is formulated with natural ingredients that work synergistically to improve your sleep patterns with continued use.\",\"question\":\"Is Sleep Elixir designed for long-term use?\"},\"item9\":{\"answer\":\"We don't recommend exceeding 3 capsules per night. If you have any specific questions or concerns, always consult with your health care practitioner.\",\"question\":\"Can I take more than 3 capsules per night?\"}},\"sleepElixirPlus\":{\"item1\":{\"answer\":\"Sleep Elixir Plus was designed for adults 18+.\",\"question\":\"Who should take Sleep Elixir Plus?\"},\"item10\":{\"answer\":\"Sleep Elixir Plus is produced in FDA Registered and Inspected Facilities that comply with FDA 21 CFR 111 standards and are cGMP Certified. Before production, all raw materials are tested for purity and quality. Certificates of Analysis (COAs) are performed on each batch of Sleep Elixir Plus to ensure the final product meets high standards, including testing for heavy metals, microbes, allergens, and contaminants.\",\"question\":\"What testing do you do on Sleep Elixir Plus?\"},\"item2\":{\"answer\":\"For best results, take Sleep Elixir Plus 60-30 minutes before bed.\",\"question\":\"When should I take Sleep Elixir Plus?\"},\"item3\":{\"answer\":\"No, Sleep Elixir Plus is not habit-forming and does not create a dependency. It supports healthy sleep patterns without leading to addiction or withdrawal effects.\",\"question\":\"Is Sleep Elixir Plus habit-forming or addictive?\"},\"item4\":{\"answer\":\"Sleep Elixir Plus may interact with prescription sleep medications, sedatives and antidepressants among others. Always consult your healthcare professional if you're taking other medications or supplements.\",\"question\":\"Can I take Sleep Elixir Plus with other medications or supplements?\"},\"item5\":{\"answer\":\"It is not advisable to take Sleep Elixir Plus while pregnant or lactating. For more specific advice, please consult with your healthcare provider.\",\"question\":\"Can I take Sleep Elixir Plus while pregnant or lactating?\"},\"item6\":{\"answer\":\"Always consult your health care practitioner before using any dietary supplement if you are pregnant or nursing, using medications or have a medical condition.\",\"question\":\"Can I take Sleep Elixir Plus if I have a sleep disorder?\"},\"item7\":{\"answer\":\"Sleep Elixir Plus is suitable for most individuals. However, if you have specific dietary restrictions or allergies, always consult your healthcare professional before use.\",\"question\":\"Can I take Sleep Elixir Plus if I have allergies or dietary restrictions?\"},\"item8\":{\"answer\":\"Yes, Sleep Elixir Plus is safe for long-term use. It is formulated with natural ingredients that work synergistically to improve your sleep patterns with continued use.\",\"question\":\"Is Sleep Elixir Plus designed for long-term use?\"},\"item9\":{\"answer\":\"We don't recommend exceeding 3 capsules per night. If you have any specific questions or concerns, always consult with your health care practitioner.\",\"question\":\"Can I take more than 3 capsules per night?\"}},\"truemed\":{\"item1\":{\"answer\":{\"line1\":\"Health Savings Accounts (HSA) and Flexible Spending Accounts (FSA) are tax-free accounts that can be used to pay for qualified health expenses. These accounts are usually set up and managed by an HSA or FSA administrator, and you should have access to said HSA/FSA administrator through your employer (ask your HR department!).\",\"line2\":\"HSAs are typically associated with a high-deductible health plan, and funds do not expire. FSAs are independent of your health plan, and funds elections occur in October-November each year for the following calendar year. FSA funds expire every calendar year.\",\"line3\":\"Unfortunately, HSAs and FSAs are not available outside of the US, and self-employed individuals (who do not have an HSA from a previous employment) do not qualify for HSAs or FSAs.\"},\"question\":\"What is an HSA/FSA account?\"},\"item2\":{\"answer\":{\"line1\":\"Truemed partners with merchants and brands to enable qualified customers to use HSA/FSA funds on qualified products and services that are used to treat, mitigate, or prevent a diagnosed medical condition. Truemed partners with a network of individual practitioners who evaluate customers' eligibility and issue Letters of Medical Necessity to qualifying customers, thereby saving customers money on legitimate medical expenditures.\",\"line2\":\"Truemed is backed by best-in-class investors, including functional medicine pioneer Mark Hyman and founders from Thrive Market, Eight Sleep and Levels.\"},\"question\":\"What is Truemed?\"},\"item3\":{\"answer\":{\"line1\":\"HSA/FSA accounts were created so individuals could use pre-tax money to pay for expenses used to treat, mitigate, or prevent a diagnosed medical condition. Because HSA/FSAs use pre-tax money, you're getting more purchasing power for your dollars. Rather than pay taxes on income and then spend it on health items, qualified customers can use pre-tax funds to invest in their health.\",\"line2\":\"An individual can contribute up to $3,850 pretax to their HSA per year, or $7,750 for a family (plus an additional $1,000 if you are at least 55 years old Individuals can contribute up to $3,050 pretax to their FSA per year (with an additional $500 in employer contributions allowed). Almost every qualified individual will save between $1,000 and $2,000, depending on their state and tax rate.\"},\"question\":\"How does using my HSA/FSA account save me money?\"},\"item4\":{\"answer\":\"In order to determine whether certain products or services are legitimate expenses for treating, mitigating, or preventing a diagnosed medical condition, HSA/FSA plan administrators often require a letter from a licensed practitioner. This letter is called a \\\"Letter of Medical Necessity.\\\"\",\"question\":\"What is a Letter of Medical Necessity?\"},\"item5\":{\"answer\":\"Unfortunately, Truemed is currently only available in the United States.\",\"question\":\"I don't live in the US. Can I still get reimbursed with Truemed?\"},\"item6\":{\"answer\":\"Generally it takes 24-48 hours. If you aren't seeing your letter in your inbox, check spam, then reach out to us at support@truemed.com for help!\",\"question\":\"How long does it take for me to receive my Letter of Medical Necessity?\"},\"item7\":{\"answer\":\"If you do not qualify, you are able to reapply for HSA/FSA spending at a later date.\",\"question\":\"If I am not approved, what happens?\"},\"item8\":{\"answer\":\"You can occasionally request a split invoice from the merchant that you are making a purchase from, but like your normal bank account, you generally need to have the funds to cover the purchase to avoid a rejection.\",\"question\":\"I don't have enough funds in my HSA/FSA account to cover the entire purchase. Can I still use Truemed?\"},\"item9\":{\"answer\":\"Please contact us at team@truemed.com so we can help you troubleshoot the issue. HSA/FSA plan administrators often have detailed requirements, so it may be as simple as re-issuing your Letter of Medical Necessity using the administrator's form.\",\"question\":\"What if my HSA/FSA payment is rejected by my administrator?\"}},\"warrantyB\":{\"answer\":{\"extendedWarrantyDescription\":{\"line1\":\"For up to 5 years following your initial purchase date, we will replace your Pod device as long as you purchased directly through Eight Sleep and are an active Plus member (\",\"line2\":\") if you have any issues or problems. urPatterns\":{\"card1\":{\"description\":\"See exactly when they happen at night, so you can pinpoint disruptions as they occur\",\"title\":\"Spot when hot flashes flare up\"},\"card2\":{\"description\":\"Every use is automatically logged, helping you spot patterns over time\",\"title\":\"Track how often they happen\"},\"card3\":{\"description\":\"Connect heat spikes to your sleep stages and take back control with daily insights\",\"title\":\"Understand the full impact\"},\"description\":\"The Pod helps you spot hot flash patterns that may be disrupting your sleep\",\"eyebrow\":\"Sleep Metrics\",\"headline\":\"Know your patterns. Take back your nights.\"},\"reviews\":{\"headline\":\"Real women already feeling the difference\",\"review1\":{\"date\":\"July 2025\",\"name\":\"Lisa T.\",\"review\":\"\\\"If you're experiencing hot flashes overnight, you must try Eight Sleep's Pod. Not only does it keep your body temp regulated, you can also enable a feature that combats hot flashes\\\"\"},\"review10\":{\"date\":\"May 2025\",\"name\":\"Jutta S.\",\"review\":\"\\\"I have the best sleep of my life since menopause with my pod\\\"\"},\"review2\":{\"date\":\"July 2025\",\"name\":\"Stephanie F.\",\"review\":\"\\\"Absolutely improves sleep if hot flashes wake you up\\\"\"},\"review3\":{\"date\":\"July 2025\",\"name\":\"Angela M.\",\"review\":\"\\\"It helps getting back to sleep faster when experiencing a hot flash\\\"\"},\"review4\":{\"date\":\"July 2025\",\"name\":\"Heather P.\",\"review\":\"\\\"Eight Sleep and Hot Flash Mode have improved my sleep by reducing hot flashes and allowing me to sleep more comfortably\\\"\"},\"review5\":{\"date\":\"July 2025\",\"name\":\"Amanda E.\",\"review\":\"\\\"On demand cooling for hot flashes\\\"\"},\"review6\":{\"date\":\"May 2025\",\"name\":\"Jennifer K.\",\"review\":\"\\\"My young self went into surgical menopause a few days after Christmas. Night sweats to a new level! @eightsleep makes my sleep amazing and I love being able to cuddling in my blankets. Not going to lie dread traveling because I won't have it with me.\\\"\"},\"review7\":{\"date\":\"July 2025\",\"name\":\"Erin T.\",\"review\":\"\\\"Great sleep, great recovery, manages menopause symptoms\\\"\"},\"review8\":{\"date\":\"June 2025\",\"name\":\"Heather M.\",\"review\":\"\\\"Bed is always the perfect temp. Life saver during menopause.\\\"\"},\"review9\":{\"date\":\"June 2025\",\"name\":\"Amanda L.\",\"review\":\"\\\"As a mid 40s woman who has hot flashes in the night, this has helped me not have to deal with those as I sleep. I don't wake up in a sudden hot sweaty mess any more and then have to cool down before I can fall asleep again.\\\"\"}},\"scrollSequence\":{\"ctaText\":\"Shop the Pod\",\"title\":\"Say goodbye to hot flashes\"},\"sleepCool\":{\"description\":\"The Pod keeps you at your ideal sleep temperature, helping prevent hot flashes before they start. But when one does hit, just tap for a powerful cooling boost.\",\"eyebrow\":\"COOLING BOOST\",\"headline\":\"Sleep cooler every night. Boost when hot flashes hit.\",\"step1\":{\"description\":\"A cooling surface helps reduce hot flashes throughout the night.\",\"eyebrow\":\"START WITH YOUR IDEAL TEMP\"},\"step2\":{\"description\":\"Tap for Hot Flash Mode—a fast cooling boost that calms the heat fast.\",\"eyebrow\":\"Feeling a hot flash coming on?\"},\"step3\":{\"description\":\"The Pod automatically returns to your normal sleep temperature.\",\"eyebrow\":\"Cooled off?\"}},\"stats\":{\"disclaimer\":\"*Results reported are based on the average reduction in hot flashes seen in an Eight Sleep clinical study evaluating menopausal women sleeping with the Pod on vs. off. Individual results may vary.\",\"hotFlashPercentage\":\"80%\",\"hotFlashText\":\"of women in menopause experience hot flashes*\",\"hotFlashTextVariant\":\"of women in menopause experience hot flashes\",\"reductionPercentage\":\"55%\",\"reductionPercentageVariant\":\"56%\",\"reductionText\":\"The Pod is clinically proven to reduce hot flashes by*\"},\"statsSecondary\":{\"disclaimer\":\"*Results reported are based on the average reduction in hot flashes seen in an Eight Sleep clinical study evaluating menopausal women sleeping with the Pod on vs. off. Individual results may vary.\",\"statNumber\":\"8 out of 10\",\"statText\":\"women feel hot flash relief within 10 minutes*\"}},\"localizeModal\":{\"countries\":{\"ae\":\"United Arab Emirates\",\"au\":\"Australia\",\"bh\":\"Bahrain\",\"ca\":\"Canada\",\"ch\":\"Switzerland\",\"dk\":\"Denmark\",\"eu\":\"Europe\",\"kw\":\"Kuwait\",\"mx\":\"Mexico\",\"qa\":\"Qatar\",\"sa\":\"Saudi Arabia\",\"se\":\"Sweden\",\"sg\":\"Singapore\",\"uk\":\"United Kingdom\",\"us\":\"United States\"},\"currencies\":{\"ae\":\"د.إ AED\",\"au\":\"$$ AUD\",\"bh\":\"د.ب BHD\",\"ca\":\"$$ CAD\",\"ch\":\"CHF\",\"dk\":\"kr DKK\",\"eu\":\"€ EUR\",\"kw\":\"د.ك KWD\",\"mx\":\"MXN\",\"qa\":\"ر.ق QAR\",\"sa\":\"ر.س SAR\",\"se\":\"kr SEK\",\"sg\":\"$$ SGD\",\"uk\":\"£ GBP\",\"us\":\"$$ USD\"},\"languages\":{\"ar\":\"AR\",\"de\":\"DE\",\"en\":\"EN\",\"es\":\"ES\",\"fr\":\"FR\",\"it\":\"IT\"},\"save\":\"Save\",\"selectRegion\":\"Select your region to see accurate pricing and shipping timelines\",\"selectRegionHeading\":\"Select your region\"},\"loginModal\":{\"errors\":{\"notImplemented\":\"Not implemented\",\"unknown\":\"An unknown error occurred\"},\"forgot\":{\"back\":\"Back\",\"emailLabel\":\"Email\",\"emailPlaceholder\":\"Email\",\"eyebrow\":\"Forgot your password?\",\"submit\":\"Reset password\",\"subtitle\":\"We'll send you a link to reset your password\",\"title\":\"Enter your email to reset your password\"},\"login\":{\"emailPlaceholder\":\"Email\",\"eyebrow\":\"MEMBER OFFER\",\"forgotPassword\":\"Forgot your password?\",\"passwordPlaceholder\":\"Password\",\"submit\":\"Log in\",\"subtitle\":\"Use your Eight Sleep App credentials to login\",\"title\":\"Log in to access offers only available to Pod owners\"},\"success\":{\"resetLinkSent\":\"Password reset link sent to your email\"}},\"marathongiveaway\":{\"cta\":{\"ctaText\":\"Shop the Pod\",\"headline\":\"Also want to crush your next PR?\",\"subheadline\":\"Get the Pod, your solution for peak performance.\"},\"form\":{\"cityCountry\":\"City and Country\",\"consent\":\"If selected, do you agree to run the marathon in Eight Sleep–branded gear and share your story through video, photos, or interview?*\",\"ctaText\":\"Enter now\",\"email\":\"Email\",\"error\":\"Something went wrong, please try again.\",\"name\":\"Name\",\"phone\":\"Phone Number\",\"success\":\"Thank you for entering. Good luck!\",\"terms1\":\"By subscribing, you agree to receive automated marketing emails with the latest news and special offers from Eight Sleep.\",\"terms2\":\"for the full Terms \u0026 Conditions. Winner announced on 07/08.\",\"termsCta\":\"Click here\",\"validationError\":\"Please fill in all required fields and check the box to enter.\"},\"hero\":{\"headline\":\"Win an entry to the 2026 NYC Marathon and a Pod\",\"subheadline\":\"Fill out the form for a chance to win a 2026 NYC Marathon bib and a Pod 5 Cover. Must be present at the Venice Run Club x Eight Sleep run on July 8 to win.\"}},\"memberStories\":{\"kateMulcahy\":{\"article\":{\"p1\":\"She’s thirty-eight, in finance, living in a pre-war Manhattan apartment that has, in her words, its temperature limitations. When she got the Pod, the bedroom was already her project. She kept the room as cool as she could, set her side to -2 or -3, and used the Autopilot temperature control to auto-adjust through the night. By the time her daughter arrived, the Pod had been part of her sleep for a while.\",\"p2\":\"Then the baby came. And sleep, which had been important, became precious.\",\"p3\":\"The newborn phase put pressure on the Pod’s features in a way she hadn’t needed before. Two things mattered most. The first was the silent vibration alarm. Waking up for 2am, 4am, 6am feedings without rolling the entire household out of bed required precision. The vibration alarm wakes the person on their side of the bed and only that person. Husband sleeps. Baby sleeps. Kate gets up.\",\"p4\":\"The second was the dual temperature zones. Kate was newly postpartum, and her body was running hotter than usual. Her husband prefers a setting around 0 or +1. She needed to drop her side to -3 some nights just to be comfortable. Without the dual zones, one of them would lose.\",\"p5\":\"“Having the dual temperature control zones mitigated our vastly different preferred sleeping temperatures when I was newly postpartum.”\",\"p6\":\"She names a third feature, almost in passing. The Autopilot temperature adjust senses both their temperature needs and adjusts through the night to prolong sleep cycles. In a newborn window, every extra fifteen minutes of consecutive sleep matters. That’s what she was optimizing for.\",\"p7\":\"Now her daughter is a toddler. The math has changed. Kate is in bed by 10:30pm most nights, wakes at 6am on weekdays and sleeps to 7 on weekends. Some nights she is woken by her toddler or has to use the bathroom, but most nights she sleeps through. The Pod is still set to -2 or -3, cooling against the warm bedroom air. Temperature, the thing that used to wake her up, doesn’t anymore.\",\"p8\":\"Her advice to expecting parents is short.\",\"p9\":\"“Sleep is so critical in the early days when you are physically and mentally giving your all to a newborn. Maximizing the sleep you can get and ensuring you can get deep restorative cycles is critical in helping you function as a new parent.”\",\"pullQuote\":\"“Sleep is so critical in the early days when you are physically and mentally giving your all to a newborn.\",\"pullQuoteContinued\":\"Maximizing the sleep you can get and ensuring you can get deep restorative cycles is critical in helping you function as a new parent.”\"},\"bottomCTA\":{\"cta\":\"Shop the Pod\"},\"description\":\"Kate Mulcahy had the Pod before she had her baby. Then her daughter arrived, and sleep became precious in a way she hadn’t expected.\",\"headline\":\"How a new parent built sleep back around 2am feedings\",\"hero\":{\"alt\":\"Kate Mulcahy standing on a rocky overlook high above the Hudson River, out hiking on a clear autumn day.\",\"name\":\"Kate Mulcahy\",\"tagline\":\"New parent. New York.\"},\"imageAlt\":{\"bedroom\":\"An Eight Sleep Pod on a neatly made bed beside a sunlit window, with a wooden nightstand and lamp.\"},\"leadIn\":\"Kate Mulcahy had the Pod before she had the baby.\",\"metadata\":{\"date\":\"June 2026\",\"readTime\":\"3 min read\"},\"snapshot\":{\"heading\":\"What Kate does differently\",\"item1\":\"Had the Pod before the baby. The newborn phase tested features she hadn’t needed before.\",\"item2\":\"Silent vibration alarm during night feedings. Wakes only her, leaving her husband and the baby undisturbed.\",\"item3\":\"Dual temperature zones: her side at -3 some nights postpartum, husband at 0 or +1. The dual zones removed the negotiation.\",\"item4\":\"Auto-temperature adjust through the night to prolong sleep cycles. Every extra fifteen minutes mattered with a newborn.\"}},\"pontusAndersson\":{\"article\":{\"p1\":\"“My answer was just to see how stubborn I was.”\",\"p10\":\"“There is a lot of value in shutting down and stepping away from the work at hand to rest and recover.”\",\"p11\":\"He treats sleep the same way he treats a long bike ride. You commit to the conditions, you don’t try to multitask through them, and you let the body do what bodies do.\",\"p12\":\"Before the Pod, he says, sleep itself was fine. He’s been fortunate that way. What was frustrating were the extremes. Getting into bed on a hot night and feeling his body refuse to cool down. Settling down to sleep on purpose when he didn’t want to. He used to do that work. Now he doesn’t.\",\"p13\":\"His read on what makes him different, as a serious athlete and a startup operator at the same time: he knows what he wants in his sleep and he refuses to sacrifice it.\",\"p14\":\"That’s the through-line. Stubbornness as a strategy. The Pod is set to 55°F because that is what works. He’s training for an Ironman because he wants to know how stubborn he is. He sleeps without an alarm because his body has been doing the job for six years. The simplest version of optimization is to find what works and refuse to change it.\",\"p2\":\"He’s thirty-one, lives in New York, and leads strategy at an AI startup that helps businesses build agent operations. He’s training for an Ironman this year. He bakes sourdough. He’s a run captain for his gym’s weekly run club. He’s a hot sleeper. None of these things are obviously connected, except in the way Pontus is. He decides what he wants and then refuses to stop until he has it.\",\"p3\":\"That same stubbornness shows up in how he sleeps. Pontus is a naturally hot sleeper. He set his Pod to 55°F on day one, the coldest setting available, and hasn’t touched it since.\",\"p4\":\"Most people dial their Pod settings in over the first days, and let it adjust for the season, changing them based on a training week too. Pontus, instead, picked the option that solved his problem and moved on. The Autopilot function is on. The temperature is 55°F to start the night. He doesn’t use an alarm. He hasn’t in six years.\",\"p5\":\"What that does for him is take sleep off the list of things he has to think about. The night before a long brick workout, a long run, or a long bike ride, he needs to be fueled, focused, and clear-headed. Those efforts demand careful preparation across nutrition and a lot of different body systems. The night before is not the moment to be negotiating with the bedroom temperature.\",\"p6\":\"“Every single time that I go to bed I’m not worried that the way that I’m going to sleep is a fight or something that is burdensome.”\",\"p7\":\"The reason this matters in his life right now is that there is not a lot of margin. Ironman training takes hours. The startup he works for has ten people, and he’s a VP-level lead on the strategy side. The week has to fit three disciplines (swim, bike, run) plus HIIT-style work at his gym, plus the company. The thing he doesn’t want to spend time on is whether his bed is the right temperature.\",\"p8\":\"Pontus is honest about how he got here. He used to be in crypto partnerships. He grew restless. He moved to New York, found a gym that scratched the right itch, got back into the kind of high-intensity training he’d done in his early twenties, then started doing Hyrox. A friend inspired him to give triathlon a shot. He says he still hasn’t figured out if it was the smartest or dumbest decision of his life.\",\"p9\":\"What he pushes back on is the trope that grinding long hours and long days is how startups get built.\",\"pullQuote\":\"“Every single time that I go to bed I’m not worried that the way that I’m going to sleep is a fight or something that is burdensome.”\"},\"bottomCTA\":{\"cta\":\"Shop the Pod\"},\"description\":\"Pontus Andersson is training for an Ironman while leading strategy at an AI startup. He set his Pod to 55°F on day one and never touched it again.\",\"headline\":\"How an Ironman trainee made stubbornness his competitive advantage\",\"hero\":{\"alt\":\"Pontus Andersson braving a New York snowstorm, bundled against the cold.\",\"name\":\"Pontus Andersson\",\"tagline\":\"Endurance athlete. New York.\"},\"imageAlt\":{\"training\":\"An Eight Sleep Pod on a neatly made bed beside a sunlit window, with a bedside table and lamp.\"},\"leadIn\":\"When Pontus Andersson’s Ironman coach asked him why he was training for this, Pontus said something his coach probably didn’t expect.\",\"metadata\":{\"date\":\"June 2026\",\"readTime\":\"3 min read\"},\"snapshot\":{\"heading\":\"What Pontus does differently\",\"item1\":\"Set the Pod to 55°F on day one and has not changed it since. Autopilot always on.\",\"item2\":\"Wakes without an alarm. Has slept this way for six years.\",\"item3\":\"Doesn’t adjust the Pod between training intensities. One setting handles a long brick workout, a recovery day, and a heavy work week.\",\"item4\":\"Treats the night before a hard session as part of the session. Sleep is set up the same way as nutrition and bike check are.\",\"item5\":\"Pushes back on the grinding-startup trope. Values shut-down time as part of the work, not opposed to it.\"}},\"samanthaHyatt\":{\"article\":{\"p1\":\"Samantha Hyatt’s husband saw the YouTube ad and brought it up. By that point, they had been fighting about the thermostat for almost three years.\",\"p2\":\"She was in her mid-twenties, a software engineer, when they moved in together. He preferred the bedroom at 75 to 80°F. She preferred it under 70°F. The fight was almost immediate, and it didn’t go anywhere for a long time.\",\"p3\":\"It may have seemed easy to solve: Get a fan. Get an air purifier. Get a smarter thermostat. The usual playbook didn’t work, plus he has severe allergies. Any fan blowing air around the room kicked up dust. They tried options anyway: personal fans on her side of the bed, the ceiling fan with him quietly turning it off after she fell asleep, sleeping in separate bedrooms on the nights when neither of them was willing to give in.\",\"p4\":\"It wasn’t a luxury problem. It was a relationship problem dressed as a temperature problem. They had been together long enough to know they wanted to share a bed for the rest of their lives. The bedroom kept refusing to cooperate.\",\"p5\":\"The Pod seemed like a financial stretch. They bought one anyway.\",\"p6\":\"Three years later, Samantha and her husband sleep in the same bed at the same time at two completely different temperatures. Her side of the bed starts at 74°F when she falls asleep, warms to 81°F through the middle of the night, and cools back to 75°F before dawn. His side stays at a consistent 76°F all night. Sometimes he manually turns it up. “Eight Sleep saved my relationship.”\",\"p7\":\"Something else has changed in those three years that Samantha didn’t expect. Her husband, the one who used to insist on 80°F, has quietly adopted the cold. His side of the bed is much cooler now than when they started. He didn’t decide to like the cold. He just had room to drift toward it without losing the fight, and his body found its way there.\",\"p8\":\"When sleep mismatch is a negotiation every night, somebody loses, and the loser slowly becomes annoyed. Take the negotiation off the table, and both people get what they want. The interesting thing that happens next is that what each of them wants can move, because the cost of moving stopped being so high.\",\"p9\":\"Samantha and her husband got married this past December. They share a bed at 74°F and 76°F, sometimes warmer, sometimes cooler. Bedtime is no longer a source of arguments.\",\"pullQuote\":\"“Moving in together had gone so well except for this one issue. We were sleeping in separate bedrooms if we could not agree on the AC.”\"},\"bottomCTA\":{\"cta\":\"Shop the Pod\"},\"description\":\"Samantha and her husband couldn’t agree on bedroom temperature for three years. Then one decision changed how they share a bed.\",\"headline\":\"How this couple stopped fighting about the thermostat\",\"hero\":{\"alt\":\"Samantha Hyatt and her husband taking a selfie outdoors by a river, both smiling in cold-weather jackets.\",\"name\":\"Samantha Hyatt\",\"tagline\":\"Eight Sleep Member\"},\"imageAlt\":{\"bedroom\":\"An Eight Sleep Pod on a neatly made bed in a calm, neutral bedroom.\"},\"metadata\":{\"date\":\"June 2026\",\"readTime\":\"3 min read\"},\"snapshot\":{\"heading\":\"What Samantha does differently\",\"item1\":\"Her side of the bed starts cool at 74°F, warms to 81°F through the middle of the night, then cools back to 75°F before dawn\",\"item2\":\"Her husband’s side stays steady at 76°F all night; he turns it up manually on the rare night he wants more warmth\",\"item3\":\"They keep the room air at her preferred cool. The Pod handles the surface temperature that each of them needs\"}},\"udayGulati\":{\"article\":{\"p10\":\"He knows. He exercises a lot of self-control around how much he actually lets himself drink.\",\"p2\":\"He’s a critical care physician in New York. His schedule rotates between day shifts (wake 5:30am, in bed by 10pm) and night shifts (wake 2:30pm, in bed by 9am). Most people who try to live a life like that end up with broken sleep, broken relationships, or both. Uday has done the work to avoid that.\",\"p3\":\"It starts with what he doesn’t do after a long shift. No phone. No screens. No bright lights when he gets home. He’ll put dishes away in a dark kitchen rather than turn on the overhead light. He’s learned that his body is tired, but his nervous system hasn’t caught up yet, and the wind-down has to start before he walks through the door. “The sleep environment has to do the work for me when my body can’t fully wind down on its own.”\",\"p4\":\"The Pod handles the part he can’t. Getting into a bed that’s already at the right temperature is, in his words, a physical cue that signals to his body it’s time to stop. On the nights, especially, when his sleep window is compressed, he doesn’t have the luxury of tossing and turning.\",\"p5\":\"The trickiest part of his schedule isn’t the long shift itself. It’s the transition from nights back to days. He’s fortunate to have a couple of days off in between, and he uses them deliberately. The first day off after nights, he forces himself to bed early and wakes up early the next morning. A brute-force reset back to a day schedule.\",\"p6\":\"He does it in part for himself. He also does it for his partner. “If I don’t, it ends up being unfair to my partner. I end up disrupting her sleep too, which I stubbornly refuse to do.”\",\"p7\":\"Exercise gets the same intentionality. On nights, he can fit in a real workout (weightlifting, Crossfit) before heading to the hospital. On day shifts, when leaving early for morning rounds makes the gym impossible beforehand, he switches to something restorative. A short swim. A stretch session. The goal is to move the body enough to help it unwind, not enough to spike heart rate before sleep.\",\"p8\":\"He’s been keeping a journal for years through his fitness tracker, logging what helps and what hurts his sleep. The data has been eye-opening. The body starts to recognize the pattern. “Treat sleep like a clinical priority, not an afterthought.”\",\"p9\":\"There’s one inconsistency Uday is honest about. He drinks coffee. He’s built a full coffee setup at home, and considers the ritual of coffee with his partner one of the things he most looks forward to when their schedules align.\",\"pullQuote\":\"“The sleep environment has to do the work for me when my body can’t fully wind down on its own.”\"},\"bottomCTA\":{\"cta\":\"Shop the Pod\"},\"description\":\"Dr. Uday Gulati rotates between day and night ICU shifts in New York. He treats sleep with the same clinical rigor he treats his patients.\",\"headline\":\"How this ICU doctor sleeps through 12-hour shift swings\",\"hero\":{\"alt\":\"Dr. Uday Gulati seated on a green velvet sofa in a warmly lit lounge, smiling, in a dark suit jacket and turtleneck.\",\"name\":\"Dr. Uday Gulati\",\"tagline\":\"Critical care physician. New York.\"},\"imageAlt\":{\"coffee\":\"Dr. Uday Gulati and his partner sitting close together at home, sharing coffee with mugs in hand.\",\"snow\":\"Dr. Uday Gulati and his partner walking together through a snow-covered forest, both bundled in winter coats.\"},\"leadIn\":\"Dr. Uday Gulati treats sleep the way he treats patients in the ICU. With a clinical priority, intentional decisions, and zero tolerance for letting the basics slide.\",\"metadata\":{\"date\":\"June 2026\",\"readTime\":\"3 min read\"},\"share\":{\"copyLink\":\"Copy link\",\"linkCopied\":\"Link copied\",\"shareOnFacebook\":\"Share on Facebook\",\"shareOnLinkedIn\":\"Share on LinkedIn\",\"shareOnX\":\"Share on X\"},\"snapshot\":{\"heading\":\"What Dr. Gu oring\":{\"paragraph1\":\"Snoring disrupts sleep. The Pod solves it automatically. Using sensors built into the Pod, it identifies snoring without relying on microphones.\",\"paragraph2\":\"When snoring is detected, the Base elevates the upper body to open the airways and reduce snoring in real time. The movement is gentle and undetectable. The impact is immediate.\",\"paragraph3\":\"In clinical studies, this smart elevation reduces snoring by up to 45%*. Sleep through the night with uninterrupted sleep for you and your partner.\",\"sectionTitle\":\"Automatic snoring mitigation\",\"tabTitle\":\"Snoring\"},\"temperature\":{\"paragraph1\":\"Sleep temperature is a matter of both preferences and biology. Your biological sex, metabolism, and body composition impact how cool or warm you feel in a given environment.  The right temperature enhances your deep sleep and REM, while also improving HRV and heart rate.\",\"paragraph2Imperial\":\"Your temperature fluctuates throughout your sleep cycles, and the Pod complements these changes, adjusting your bed within comfortable ranges between 55°F to 110°F on both sides. Each bed partner can sleep at their perfect temperature.\",\"paragraph2Metric\":\"Your temperature fluctuates throughout your sleep cycles, and the Pod complements these changes, adjusting your bed within comfortable ranges between 12°C to 43°C on both sides. Each bed partner can sleep at their perfect temperature.\",\"sectionTitle\":\"Dynamic cooling and heating, just for you\",\"tabTitle\":\"Temperature\"}}}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$L43\"}]\n"])</script><script>self.__next_f.push([1,"44:I[46160,[\"45592\",\"static/chunks/c15bf2b0-b630b56adb7ba9c9.js\",\"19268\",\"static/chunks/aaea2bcf-5e3e43ad4bc8f182.js\",\"80586\",\"static/chunks/13b76428-8370110ed6fd8870.js\",\"625\",\"static/chunks/625-7c812395f7526269.js\",\"52619\",\"static/chunks/52619-c48a18d6f62d2371.js\",\"89061\",\"static/chunks/89061-bcda304b7c14129c.js\",\"9365
