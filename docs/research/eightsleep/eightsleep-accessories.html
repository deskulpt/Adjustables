  position: absolute;
  width: 100%;
  height: 100%;
}
.rfm-overlay::before, .rfm-overlay::after {
  background: linear-gradient(to right, var(--gradient-color), rgba(255, 255, 255, 0));
  content: "";
  height: 100%;
  position: absolute;
  width: var(--gradient-width);
  z-index: 2;
  pointer-events: none;
  touch-action: none;
}

  right: 0;
  top: 0;
  transform: rotateZ(180deg);

  left: 0;
  top: 0;
}

  animation-delay: var(--delay);

ting emails with the latest news and special offers from Eight Sleep.\",\"terms2\":\"for the full Terms \u0026 Conditions. Applications are open until April 19th 2026.\",\"termsCta\":\"Click here\"},\"hero\":{\"ctaText\":\"Play the video\",\"headline\":\"The Rey of Padel, Powered by Eight Sleep\"},\"quote\":{\"ctaText\":\"Shop the Pod\",\"headline\":\"The first thing I do every morning is check how I slept. Eight Sleep helps me understand my body, recover better, and feel ready for whatever comes next.\"},\"sponsor\":{\"headline\":\"Eight Sleep is proud to fuel the Rey of Padel\",\"imgHeadline\":\"Arturo Coello\",\"imgSubheadline\":\"World #1 Padel Player\",\"subheadline1\":\"From endless hours on court to the silent battles of sacrifice and discipline,\",\"subheadline2\":\"world #1 Arturo Coello\",\"subheadline3\":\"has risen to the very top.\",\"subheadline4\":\"Behind every victory lies relentless training, unbreakable dedication — and the recovery that makes it possible.\"}},\"astonmartin\":{\"giveaway\":{\"ctaText\":\"Get Updates\",\"error\":\"Something went wrong, please try again.\",\"form\":{\"email\":\"Email address\"},\"headline\":\"Stay close to the paddock\",\"subheadline\":\"Be the first to access behind-the-scenes content, performance insights, and future releases from the Aston Martin Aramco Formula One™ Team x Eight Sleep partnership.\",\"success\":\"Thank you for subscribing.\",\"terms\":\"By subscribing, you agree to receive automated marketing emails with the latest news and special offers from Eight Sleep.\",\"termsCta\":\"Click here\"},\"hero\":{\"headline\":\"A Sleeping Giant Awakes\",\"subheadline\":\"This season, Aston Martin Aramco Formula One™ Team and Eight Sleep are partnering to optimize driver advantage, on and off the track.\"},\"shop\":{\"ctaText\":\"Shop the Pod\",\"firstParagraph\":\"Eight Sleep provides Aston Martin Aramco Formula One™ Team with its industry-leading sleep technology, the Pod, designed to optimize recovery through AI-driven temperature regulation and continuous physiological tracking.\",\"headline\":\"Advanced recovery by Eight Sleep\",\"secondParagraph\":\"The Pod responds to the body night by night, turning sleep into a controllable performance lever across the entire race season\"},\"sponsor\":{\"headline\":\"Cars win races. Drivers win seasons.\",\"subheadline\":\"At the highest level of motorsport, performance is not defined by race day alone. It is built night after night through recovery, consistency, and readiness. This partnership reflects Aston Martin Aramco Formula One™ Team’s commitment to optimizing every variable that influences results, including achieving deep sleep through smart technology.\"},\"stats\":{\"deepSleep\":\"improvement in deep sleep\",\"headline\":\"Trusted by thousands of elite athletes across disciplines, Eight Sleep’s technology has demonstrated measurable impact at scale:\",\"sleepQuality\":\"better overall reported sleep quality\",\"smallPrint\":\"Reinforcing sleep as a critical driver of recovery and performance.\",\"upTo\":\"Up to\"}},\"atc\":{\"autopilot\":{\"explanation\":\"Eight Sleep hardware products need Autopilot to ensure sleepers experience optimal sleep stages by adjusting factors like temperature and elevation throughout the night. This is crucial because a key factor for poor sleep is maintaining the wrong temperature. Autopilot aims to match your body's natural circadian rhythm and temperature needs for each sleep stage, enhancing the quality of deep and REM sleep.\",\"terms\":\"Autopilot is required for the first 12 months (cancel any time), and covers up to two separate users. As an Eight Sleep member, you are automatically enrolled for subscription renewal and we will charge your card on file. Failure to renew your subscription may cause service interruptions.\",\"title\":\"Autopilot Subscription\"},\"company\":{\"address\":\"915 Broadway\",\"city\":\"New York, NY 10010\",\"name\":\"Eight Sleep, Inc.,\"},\"cookies\":{\"advertising\":\"We use the following third-party advertising cookies to present you with opportunities to purchase Eight Sleep products on our Site; and retargeting cookies, to present you with Eight Sleep advertising on other websites based on your interaction on our Sites and other websites.\",\"detailed\":\"For a comprehensive understanding of what we use, please read full details in our site's \u003cprivacyLink\u003eprivacy policy\u003c/privacyLink\u003e and \u003ccookieLink\u003ecookie policy\u003c/cookieLink\u003e.\",\"doNotTrack\":{\"content\":\"Although we would like to honor the browsers set with a \\\"Do Not Track\\\" signal, the Sites do not currently respond to a DNT or similar signal as it awaits the results of efforts by the policy and legal community to determine the meaning of DNT and the proper way to respond.\",\"title\":\"Does Eight Sleep Honor \\\"Do Not Track\\\" Signals?\"},\"facebookCustomAudiences\":\"Facebook Custom Audiences: You can adjust your Facebook advertising settings from within your Facebook account and opt-out of advertisements from within the Facebook application\",\"general\":\"We use cookies and other technologies like pixel tags and web beacons to improve the functionality of the Eight Sleep Service. Please see our Cookie Policy \u003ca\u003ehere\u003c/a\u003e.\",\"googleAdwords\":\"Google Adwords Conversion: You can adjust the Google Ads Settings and opt-out of this program.\",\"googleAnalytics\":\"We use Google Analytics, New Relic, KissInsights and Optimizely analytics cookies allow us to see how you use our services so we can improve your experience. We encourage you to read the Google Privacy Policy. If you prefer to not have data reported by Google Analytics, you can install the Google Analytics Opt-out Browser Add-on. You can read the Optimizely Privacy Policy. You can also read the New Relic privacy policy\",\"mixpanel\":\"Mixpanel: We use Mixpanel as our primary analytics tool to understand how our customers use the Eight Sleep Service and Mixpanel People to contact you about the use of our product, for example, to proactively assist you if you have trouble syncing your Device. You can read the MixPanel Privacy Policy\",\"title\":\"Cookie Policy\",\"twitterAdvertising\":\"Twitter Advertising: This cookie allows us to present you with retargeting advertising for Eight Sleep products on Twitter. This Twitter FAQ explains how their advertising program works and gives you the option to adjust your Twitter settings.\"},\"dataCollection\":{\"activate\":{\"content\":\"When activating a Eight Sleep Device, you will be asked to download the Eight Sleep App or install Software and enter information about yourself, such as date of birth and gender. We use this information to personalize your sleep stats and sleep recommendations. Depending upon the specific Device you use, it can collect data such as the amount of time slept, measure your sleep quality and transmit this data to Eight Sleep. To see the full list of data that your Device collects, visit our Product Specifications page.\",\"title\":\"Activate Device\"},\"addInfo\":{\"content\":\"You can customize your Eight Sleep experience by adding other types of information to your account, such as usual bedtime, sleep goal, whether or not you sleep with a partner or pet, and select relevant health information (e.g., gender, menstrual cycle regularity, instances of sleep conditions, instance of health conditions). Whenever you add this type of data, we collect it and store it in your Eight Sleep account.\",\"title\":\"Add Info To Your Account\"},\"buyFromStore\":{\"content\":\"Credit card information is handled by our third-party payment processor. We store your shipping address so we can process your order through our fulfillment partner. If you are logged into your Eight Sleep account when you purchase something on our Site, we associate that order with your Eight Sleep account.\",\"title\":\"Buy From Our Store\"},\"contactSupport\":{\"content\":\"Whenever you contact Eight Sleep for help, we collect your name and email address along with additional information you provide in your request so that we can provide you with assistance and improve the Eight Sleep Service. If you contact us when you are already logged in to your account, the web form automatically pre-fills this information, so you don't have to type it manually. You can also contact Eight Sleep on public forums such as Twitter or Facebook; however, we cannot maintain the privacy of your communication to us if you contact us through these channels.\",\"title\":\"Contact Us\"},\"createAccount\":{\"content\":\"If you want to access data collected by your Device, you must create an Eight Sleep account. When you create an Eight Sleep account, we ask for some personal information, including your name, email address, date of birth, and biological sex. Your email address will be your Eight Sleep account user name, which you will use to log-into your account. We do not display your email address to other users.\",\"title\":\"Create An Eight Sleep Account\"},\"inviteFriends\":{\"content\":\"To help you stay motivated on your sleep improvement journey, Eight Sleep might let you add friends who are already Eight Sleep users or invite friends who have not yet joined. In such cases, you can add friends by copying and sharing the referral link directly with them.\",\"title\":\"Invite Friends\"},\"locationFeatures\":{\"content\":\"The Eight Sleep Service includes features that require the collection of specific location data, including: GPS signals, device sensors, Wi-Fi access points, and cell tower IDs. We only collect this type of data when you activate a location feature, such as run mapping. We stop collecting this type of data when you deactivate the feature. We store this information in your Eight Sleep account. If you are using a mapping feature, we will send your location information to our mapping service provider so they can display your location on a map. They are contractually prevented from sharing or using this data for any other purpose.\",\"title\":\"Activate Location Features\"},\"syncDevice\":{\"content\":\"When you sync your Device through an App or the Software, data recorded on your Device about your sleep activity is transferred from your Device to our servers. Sleep activity includes, but is not limited to: total sleep time (TST), time and % in stages (deep, light, and REM), WASO (wake after sleep onset), HR/HRV/breath rate, snoring, and SOL (Sleep onset latency). This data is stored and used to provide the Eight Sleep Service and is associated with your account. Each time a sync occurs, we log data about the transmission. Some examples, but not limited to, of the log data are the sync time and date, connectivity, and the IP address used when syncing.\",\"title\":\"Sync Your Device\"},\"title\":\"When We Collect Data\",\"visitSites\":{\"content\":\"Eight Sleep collects industry standard data from everyone who visits our Sites—even if you don't have an Eight Sleep account. This includes log data that automatically records information about your visit, such as your browser type, operating system, the URL of the page that referred you, the different actions you performed, and the IP address you used to access pages on the Site. We use this type of information to provide you with an experience that's relevant to your location based on the IP address, to prevent Site misuse, and to ensure the Site is working properly. We also collect data from cookies. To see the full list of cookies we use and how we use them, please read our \u003ca\u003eCookie Policy\u003c/a\u003e.\",\"title\":\"Visit Our Sites\"}},\"dataManagement\":{\"deactivation\":{\"content\":\"You can deactivate your Eight Sleep account by contacting Customer Support. When you do, data that can identify you will be removed from the Eight Sleep Service, including but not limited to your email, name, and photo(s). Backup copies of this data will be removed from our server based upon an automated schedule, which means it may persist in our archive for a short period. Eight Sleep may continue to use your de-identified data after you deactivate your account.\",\"title\":\"How To Deactivate Your Eight Sleep Account\"},\"editing\":{\"content\":\"Data that you provide to Eight Sleep through the Site can be modified from your dashboard or Eight Sleep account preferences. If you remove data from your Eight Sleep account, it will no longer appear to you or others who use the Eight Sleep Service. Backups of that data will remain associated with your Eight Sleep account and in our archive servers.\",\"title\":\"How To Edit Or Modify Data\"},\"retention\":{\"content\":\"We store your PII for as long as you maintain an Eight Sleep account.\",\"title\":\"How Long We Save Your Data\"}},\"dataSharing\":{\"deidentified\":{\"content\":\"Eight Sleep may share or sell aggregated, de-identified data that does not identify you, with partners and the public in a variety of ways, such as by providing research or reports about health and sleep. When we provide this information, we perform appropriate procedures so that the data does not identify you and we contractually prohibit recipients of the data from re-identifying it back to you.\",\"title\":\"Data That Does Not Identify You (De-Identified Data)\"},\"directed\":{\"content\":\"You can direct us to share data with other parties. For example, you might authorize us to link your Eight Sleep account with a third-party app; send status updates to your Facebook or Twitter account; connect with Apple Health; or direct us to share data with your employer as part of a wellness program. Once you direct us to share your data with a third party, that data is governed by the third-party's privacy policy.\",\"title\":\"Data That You Direct Us To Share\"},\"identifiable\":{\"businessTransfers\":\"We may disclose or transfer your PII in connection with the sale, merger, bankruptcy, sale of assets or reorganization of our company. We will notify you if a different company will receive your PII and the promises in this Privacy Policy will apply to your data as transferred to the new entity.\",\"definition\":\"Personally Identifiable Information (PII) is data that includes a personal identifier like your name, email or address, or data that could reasonably be linked back to you. We will only share this data under the following circumstances:\",\"legalCompliance\":\"If we believe that disclosure is reasonably necessary to comply with a law, regulation, valid legal process (e.g., subpoenas or warrants served on us), or governmental or regulatory request, to enforce or apply the Terms of Service or Terms of Sale, to protect the security or integrity of the Eight Sleep Service, and/or to protect the rights, property, or safety of Eight Sleep, its employees, users, or others. If we are going to release your data, we will do our best to provide you with notice in advance by email, unless we are prohibited by law from doing so.\",\"serviceProviders\":\"With companies that are contractually engaged in providing us with services, such as order fulfillment, email management and credit card processing. These companies are obligated by contract to safeguard any PII they receive from us.\",\"title\":\"Data That Could Identify You\"},\"title\":\"What Kinds Of Data We Share\"},\"dataUsage\":{\"ageGender\":\"Age, gender and sleep quality are used to provide personalized sleep recommendations.\",\"contactInfo\":\"Contact information is used to send you notifications and to inform you about new features or products we think you would be interested in. Please see \\\"Can I Opt-out Of Receiving Eight Sleep Emails?\\\" for information on how you can opt-out of future communications.\",\"content\":\"Eight Sleep uses your data to provide you with the best experience possible, to help you make the most of your sleep, and to improve and protect the Eight Sleep Service. Here are some examples:\",\"dataLogs\":\"Data and logs are used in research to understand and improve the Eight Sleep Device and Eight Sleep Service; to troubleshoot the Eight Sleep Service; to detect and protect against error, fraud or other criminal activity; and to enforce the Eight Sleep Terms of Service.\",\"deidentifiedUsage\":\"De-identified data that does not identify you may be used to inform the health and scientific community about trends; for marketing and promotional use; or for sale to interested audiences. See \\\"Sharing of De-identified Data That Does Not Identify You\\\" to learn more.\",\"title\":\"Why We Collect Data\"},\"hero\":{\"description\":\"Join the Eight Sleep App, the only membership for sleep fitness. Track your sleep, see trends and personal insights, receive sleep coaching, access the content you need to wind down and wake up.\",\"subtitle\":\"Terms and conditions of the Eight Sleep mobile application\",\"title\":\"Hero for Terms and conditions of the Eight Sleep mobile application\"},\"links\":{\"blog\":\"eightsleep.com/blog\",\"cookiePolicy\":\"Link to Cookie Policy\",\"cookiePolicyOpen\":\"Open Cookie Policy (New Window)\",\"googleAds\":\"Link to Google Ads\",\"googleAnalyticsOptout\":\"Link to Google Analytics Opt-out Browser Add-on\",\"mixpanelOptout\":\"Link to mixpanel optout\",\"mixpanelPrivacy\":\"Link to MixPanel Privacy Policy\",\"newRelicPrivacy\":\"Link to New Relic Privacy\",\"optimizelyOptout\":\"Link to Optimizely opt out\",\"optimizelyPrivacy\":\"Link to Optimizely Privacy\",\"privacyPolicy\":\"Open Privacy Policy (New Window)\",\"twitterSafety\":\"Link to Twitter Safety and Security\"},\"pledge\":{\"content\":\"We pledge to respect your privacy, to be transparent about our data practices, to keep your data safe and to only collect data that helps us improve our products and services.\",\"description\":\"Eight Sleep designs products and tools that track everyday sleep to empower and inspire users to lead healthier and happier lives. This Privacy Policy applies to our personal fitness and electronic body monitoring products (\\\"Devices\\\"), our websites located at\",\"helpContact\":\"And remember, we're here to help. If something in this policy does not make sense or if you have any questions, please contact us at\",\"policyChanges\":\"Because we're always looking for new and innovative ways to help you achieve your sleep goals, this policy may change over time, but any future changes will not affect data that was collected under a previous version of this policy. If any modifications substantially change your rights, we will send an email summarizing the changes to the address associated with your Eight Sleep account and provide notice on the Site.\",\"sitesContinuation\":\"(individually a \\\"Site\\\" and collectively \\\"Sites\\\"), the Eight Sleep Connect software (\\\"Software\\\") and Eight Sleep mobile applications (the \\\"Apps\\\"). The Devices, Sites, Software and Apps are collectively referred to in this Policy as the \\\"Eight Sleep Service,\\\" and by proceeding to use the Eight Sleep Service you consent that we may process the data that we collect from you in accordance with this Privacy Policy.\",\"title\":\"Our Pledge\"},\"policies\":{\"children\":{\"content\":\"Eight Sleep is not directed at persons under the age of 16. We do not knowingly collect any PII from children under 16. We will share information only to the owners of the account which pursuant to these terms and conditions, must be older than 16. If you are aware of a user under the age of 16 using Eight Sleep, please contact us at\",\"title\":\"Eight Sleep's Policies For Children\"},\"dataSecurity\":{\"content\":\"Eight Sleep uses a combination of technical and administrative security controls to maintain the security of your data. If you have a security-related concern, please contact Customer Support.\",\"title\":\"How Does Eight Sleep Keep My Data Safe\"},\"emailOptOut\":{\"content\":\"Of course! You ca \"title\":\"Neuroscientist \u0026 UC Berkeley professor\"}},\"noWearableNeeded\":{\"benefits\":{\"automaticImprovement\":\"Automatic sleep improvement\",\"improvedComfort\":\"Improved sleeping comfort\",\"noEffort\":\"No effort or action needed\",\"nonInvasive\":\"Non-invasive sleep aid\",\"noPrescription\":\"Doesn't require a prescription\",\"personalized\":\"Personalized solutions\",\"tracksSleep\":\"Tracks sleep and health without a wearable\"},\"body\":\"Sleep is foundational to your health. We go beyond wearables, to deliver sleep improvement without the need to charge, wear, or remember to take anything. We lean on the science to develop products that personalize your sleep environment for optimal recovery.\",\"cta\":\"Read more on our blog\",\"headline\":\"More and better sleep. No wearable or prescription needed.\"},\"peerReviewedFindings\":{\"body\":\"In a free-living study, we examined how sleep and cardiovascular health metrics were positively affected by sleeping for one week on the Pod.\",\"cta\":\"Read more here\",\"headline\":\"Peer-reviewed findings that prove better sleep\"},\"thePodVersusOtherSleepAids\":{\"cta\":\"Shop the Pod\",\"headline\":\"Why the Pod is the best sleep aid\",\"tableHeaders\":{\"melatonin\":\"Melatonin\",\"prescriptionMedicine\":\"Prescription sleep medicine\",\"thePod\":\"The Pod\",\"wearables\":\"Wearables\"},\"tableItems\":{\"balancedSleep\":\"Gives you balanced sleep\",\"fallAsleepFaster\":\"Helps you fall asleep faster\",\"noConsumable\":\"No consumable needed\",\"nonAddictive\":\"Non-addictive\",\"noSideEffects\":\"No side-effects\",\"nothingToWear\":\"Nothing to wear or charge\",\"safeForLongTerm\":\"Safe for long-term use\",\"stayAsleep\":\"Helps you stay asleep\",\"tracksSleep\":\"Tracks your sleep\"}},\"twelveWeeks\":{\"energy\":{\"bars\":{\"daytimeEnergy\":\"Higher daytime energy scores for more energy\",\"sleepInterruptions\":\"Fewer sleep interruptions to stay asleep longer\",\"sleepOnset\":\"Faster sleep onset to fall asleep faster\"},\"cta\":\"Read more here\",\"header\":\"Boost your energy and wake up refreshed\",\"title\":\"When using the Pod for just one week, participants in a study reported significant changes to their energy levels from improved sleep.\"},\"executiveFunction\":{\"bars\":{\"executiveFunction\":\"Increase in executive function for better attention to detail\",\"processingSpeed\":\"Increase in processing speed for faster information processing\",\"shortTermMemory\":\"Increase in short-term memory for improved recall\"},\"cta\":\"Read more here\",\"header\":\"Sharpen your focus and cognition\",\"title\":\"After using the Pod for just two days, participants in a study experienced remarkable changes in overall executive function.\"},\"modals\":{\"energy\":{\"conclusion\":\"These levels of sleep quality improvements are comparable to improvements from cognitive behavioral therapy for sleep.\",\"cta\":\"Read more here\",\"daytimeEnergy\":\"34% higher daytime energy scores\",\"headline\":\"Improved energy with the Pod\",\"highlight\":\"After one month of sleeping on the Pod, members reported 32% better sleep quality scores on average.\",\"intro\":\"Sleep quality is a critical pillar for happiness, productivity, and health. At Eight Sleep, we are committed to improving your sleep fitness through our dedication to scientific rigor and validation. We are excited to share the results of our latest research study, where we have found significant improvements in various sleep metrics from sleeping on the Eight Sleep Pod.\",\"introSuffix\":\"This overall improvement in sleep quality consists of improvements in each of the following components:\",\"sleepInterruptions\":\"23% fewer sleep interruptions\",\"sleepOnset\":\"44% faster sleep onset\"},\"executiveFunction\":{\"cognitiveHeadline\":\"What are the different cognitive functions we measured?\",\"cognitiveIntro\":\"We measured three main domains of cognitive function: processing speed, short-term memory, and executive function.\",\"cta\":\"Read more here\",\"executiveFunction\":\"13% increase in executive function\",\"executiveFunctionDesc\":\"Executive function involves planning, attention, remembering instructions, and multitasking. For example, effectively planning, delegating, and adjusting priorities for your team requires strong executive function.\",\"headline\":\"Increased cognitive function with the Pod\",\"intro\":\"A good night's sleep is crucial for maintaining health, emotional well-being, and overall wellness. Our prior studies have demonstrated that sleeping on the Eight Sleep Pod can improve deep sleep, total sleep time (TST), overall sleep quality, and cardiovascular recovery (\",\"introSuffix\":\"). Our latest research reveals an additional benefit of the Pod: it also enhances cognitive function. Overall, we found that after subjects slept on the Pod for 2 nights, they experienced:\",\"processingSpeed\":\"8% increase in processing speed\",\"processingSpeedDesc\":\"Processing speed is the rate at which a person can perceive, understand, and respond to information. This could be important when trying to make decisions quickly, like when an athlete is deciding where to make a pass in a split second.\",\"ref\":\"ref\",\"shortTermMemory\":\"9% increase in short-term memory recall speed\",\"shortTermMemoryDesc\":\"Short-term memory is the capacity to remember information in a short period of time. For example, remembering a phone number long enough to dial it back indicates good short-term memory.\"},\"strengthTraining\":{\"cardiovascular\":\"Enhanced cardiovascular recovery\",\"cardiovascularDesc\":\"With Pod ON, participants saw cardiovascular changes of the magnitude you would expect with 12 weeks of exercise training. Average HR decreased by 2%, and average HRV increased by 7%.\",\"cardiovascularHeadline\":\"The Pod enhanced cardiovascular recovery\",\"cardiovascularIntro\":\"Using the Pod had a positive impact on cardiovascular recovery during sleep for both men and women:\",\"conclusion\":\"These cardiovascular improvements were transient and specifically induced by the Pod since they disappeared when participants turned off the Pod at the end of the study. Notably, these positive changes in HR and HRV were unrelated to changes in exercise, as there were no significant changes in exercise habits throughout the study.\",\"cta\":\"Read more here\",\"deepSleep\":\"Increased deep, light, and REM sleep\",\"deepSleepDesc\":\"With the Pod ON, men's deep and light sleep increased by 14 min (+22%) in the first half of the night, and light sleep by 23 min (+19%) in the second half of the night. Women's REM sleep increased by 9 min (+25%) in the first half of the night.\",\"headline\":\"Improved sleep and recovery with the Pod\",\"hrDecrease\":\"On average, participants experienced a statistically significant decrease with Pod ON of approximately 1 beat per minute (bpm) in HR, corresponding to a 2% decrease on average, with up to a 13% decrease in sleeping HR.\",\"hrvIncrease\":\"Heart rate variability (HRV) significantly increased by an average of 7% with Pod ON, with up to a 17% improvement in HRV.\",\"intro\":\"In the first research study of its kind, our R\u0026D team explored the impact of the Pod on sleep quality and cardiovascular recovery in 54 participants with more than 300 nights of home sleep test (HST) device data. Participants slept for one week with Pod temperatures off (Pod OFF), followed by one week with Pod temperatures on (Pod ON), and a final two nights with Pod OFF.\",\"perception\":\"Improved perception of sleep quality\",\"perceptionDesc\":\"Participants reported their sleep was significantly calmer, more comfortable, and that it was easier to fall asleep with the Pod ON vs. OFF.\",\"sleepMetricsHeadline\":\"Sleeping on the Pod improved sleep and health metrics\",\"sleepMetricsIntro\":\"The study revealed several exciting findings regarding the Pod's impact, including:\"}},\"strengthTraining\":{\"bars\":{\" g the head to open air passageways during sleep.\",\"disclaimer\":\"*Requires the Base\",\"title\":\"Clinically proven to reduce snoring\"},\"sleepFitness\":{\"description\":\"Every morning, the Pod gives you a personalized Sleep Fitness Score based on heart rate, HRV, and sleep quality.\",\"title\":\"Your nightly recovery, scored\"},\"sleepStages\":{\"description\":\"Track how much time each of you spends in light, deep, and REM sleep, all without a wearable.\",\"title\":\"See every stage, from deep sleep to REM\"},\"vibrationAlarm\":{\"description\":\"Set a silent alarm that wakes only you up with vibrations on your side of the bed, perfect for different schedules.\",\"title\":\"Wake to gentle vibrations\"}},\"title\":\"Smart features made for two\"},\"hero\":{\"cta\":\"Shop now\",\"headline\":\"Better sleep, together\",\"labV20260518\":{\"headline\":\"Two temperatures, one bed\"},\"subheadline\":\"The Pod upgrades any mattress with cooling and heating on each side of the bed. Each partner gets their ideal temperature, automatically adjusted all night for deeper, uninterrupted sleep.\",\"videoAriaLabel\":\"Better sleep, together\",\"videoButtonText\":\"See how it works\"},\"immersiveTemperature\":{\"ctaText\":\"Explore the Cover\",\"description\":\"Add the Pod over any mattress and unlock dual zone temperature control\",\"headline\":\"Sleep at two temperatures in one bed\"},\"metadata\":{\"description\":\"The Pod upgrades any mattress with cooling and heating on each side of the bed.\",\"title\":\"Clinically-Backed Sleep for Couples\"},\"scrollSequence\":{\"ctaText\":\"Shop the Pod\",\"title\":\"One Pod, Two perfect climates\"},\"testimonial\":{\"author\":\"- Marni, Eight Sleep Member\",\"quote\":\"\\\"My partner and I used to argue in the middle of the night about the AC — one of us too cold, the other too hot. The Pod completely changed that.\\\"\"},\"timeline\":{\"items\":{\"bodyCools\":{\"description\":\"Your core body temperature needs to drop for sleep to begin. As you drift off, the Pod lowers the bed into sleep mode and begins cooling to ease you into deep rest.\",\"title\":\"Your body cools. Sleep begins.\"},\"deepSleep\":{\"description\":\"You enter deep sleep. The Pod cools further to support cellular recovery and help you stay there longer.\",\"title\":\"Deep sleep, deeper cooling\"},\"remSleep\":{\"description\":\"Your brain becomes more active. This is where dreams (and creativity) happen. The Pod gradually warms your body to support REM brain activity.\",\"title\":\"REM sleep supported\"},\"roomTempChange\":{\"description\":\"The Pod senses a cooler bedroom than usual and warms your side of the bed slightly to maintain optimal comfort\",\"title\":\"Room temp change detected. Adjustment made.\"},\"setTheScene\":{\"description\":\"Your bed and blanket are perfectly heated or cooled to your liking. Elevation adjusts for reading, while soothing soundscapes ease you into rest.\",\"title\":\"The Pod Sets The Scene\"},\"sleepRevealed\":{\"description\":\"The Pod delivers your Sleep Fitness Score and personalized insights to help you sleep even better tonight\",\"title\":\"Your sleep, revealed\"},\"snoringDetected\":{\"description\":\"The Pod detects snoring from your partner. It quietly elevates their side of the bed preventing disruption without waking you.\",\"title\":\"Snoring detected. Problem solved.\"},\"wakeUp\":{\"description\":\"The Pod detects light sleep and wakes you gently with warmth and vibration — minutes before your set sound alarm. A subtle rise from the Base makes getting up effortless.\",\"title\":\"Wake up, the right way\"}}}},\"dreams\":{\"charlesLeclerc\":{\"article\":{\"intro\":{\"p1\":\"Ask Charles Leclerc what goes through his mind when he slips into bed, and the answer may surprise you. Despite being a driver chasing a world championship across continents, it is rarely only racing.\",\"p2\":\"“I’ve raced since I was three and a half years old, and I’ve spent many of my nights thinking about racing and racing only,” he says. “But I’m also very creative. I get obsessed with things very quickly, with new passions. One week it will be padel, the other week it will be music and piano.”\",\"p3\":\"New curiosities arrive almost weekly. Some are tied to the car. Most are not. But when the excitement of his passions, old or new, start to keep him awake, he has trained himself to do the one thing that you wouldn’t think his go-go-go personality permits: sleep. “I value sleeping,” he says. “So I found ways to switch off the brain as much as possible.”\"},\"learnedAtTwelve\":{\"heading\":\"The discipline of rest\",\"p1\":\"Leclerc credits learning the discipline of rest early in life, and prioritizing it throughout his career, to his success. At twelve, he attended a performance center in Italy built around two things: physical and mental training. “Physical training, even at twelve, I knew what that meant. But mental training for me was completely new.”\",\"p2\":\"There he was tested on focus and mental performance, and shown the drastic differences in his output when he was tired. That lesson, that high-quality sleep is essential to performance, landed early and never left. “Honestly it’s more about luck than me realizing it,” he says. “I learned about it very early on, and that has been a huge benefit.”\",\"p3\":\"At that training camp, he also learned a tool that he still reaches for on nights when his mind refuses to quiet down: breathing techniques. They don’t erase the thoughts, he says, but they soften them enough to let him fall asleep.\",\"p4\":\"Early prioritization of sleep has freed him from a guilt that a lot of high performers carry. While others boast about burning the midnight oil and rising with the sun, Leclerc has been open about sleeping ten, sometimes eleven hours, guilt-free. “I don’t feel guilty at all. I really enjoy sleeping.” His true sweet spot, he reckons, is closer to eight hours, but a demanding schedule that takes him around the world and jet lag compound his sleep debt. When he’s home, he tries to pay it off with consistent, high-quality sleep.\"},\"meantToBe\":{\"heading\":\"Seven years in the making\",\"p1\":\"His view on rest, performance, and recovery is what drew Leclerc toward Eight Sleep, first as a user, then ambassador, then investor. The reason is practical. “I travel all the time, and every time I’m at home, it’s for very few nights. Those few nights are very important for me to be back at 100%.” The Pod also solved something specific in his own bedroom. He and his wife Alexandra never agreed on temperature: He runs warm and would end up on top of the covers; she runs cold and would stay underneath. Being able to set each side separately and sleep side-by-side, he says, “is probably the best feature in the world.”\",\"p2\":\"The partnership itself was kismet. Leclerc tried the Pod, loved it, and reached out to co-founder and CEO Matteo Franceschetti, an Italian and a lifelong motorsport fan, to propose doing something together. They agreed to meet in Miami. It was there that Franceschetti told him the rest of the story: Eight Sleep had quietly approached Leclerc’s manager seven years earlier, when the company was much smaller, and nothing had come of it. Leclerc had never known. “Seven years later, I was the one to contact Matteo,” he says. “It’s a cool story. At the end, it was meant to be that way.”\",\"p3\":\"What convinced him to put his name and his money behind the brand was in part the product he and his wife loved, but it was also the people. Visiting Eight Sleep’s design team in San Francisco, what struck him was how a company that size could remain nimble. “How reactive the team is, considering how big the company already is, has always been very impressive.”\"},\"mindWontSwitchOff\":{\"heading\":\"Racing is just the beginning\",\"p1\":\"Leclerc’s list of passions is long, and still growing. After stumbling on a YouTube video during COVID, he picked up padel, having played squash and tennis as a kid. “As soon as we could get out of home, I asked three friends to come and try it with me, and I absolutely loved it.” Then there’s piano and music, which he calls his deepest form of disconnection from the outside world, rotating through songs by Coldplay, The Kooks, and The Strokes. “Probably where I disconnect most is when I actually play the piano.” He’s even composed with French pianist Sofiane Pamart.\",\"p2\":\"Reading, for Leclerc, is another passion, an opportunity to expand his knowledge. His reading appetite is vast: books on AI, on psychology, and, currently, on the whole history of humanity. He also plays chess, a habit he started with his grandfather as a child and never dropped, for “peace of mind, and the fact of always thinking ahead.” He recently tried Pilates, purely to get out of his comfort zone.\",\"p3\":\"It’s a lot of inputs, which is exactly why the off switch matters so much.\"},\"pullQuote1\":\"“I get obsessed with things very quickly. One week it will be padel, the other week music and piano.”\",\"pullQuote2\":\"“I don’t feel guilty at all. I really enjoy sleeping.”\",\"simplestLife\":{\"attribution\":\"Charles Leclerc is a racing driver and an Eight Sleep ambassador and investor.\",\"heading\":\"On dreams, and what really matters\",\"p1\":\"Ever since he was a boy, Leclerc has had one dream: “To be a world champion. This is all I’ve ever dreamed about, and all I’ve ever worked for.”\",\"p2\":\"For someone chasing champion status, his other ambitions are strikingly modest. He craves “to have the simplest life, keeping all those passions alive.”\",\"p3\":\"“At the end of the day, what really matters in life is the people you love most,” says Leclerc.\"}},\"bottomCTA\":{\"cta\":\"Shop the Pod\"},\"description\":\"Racing driver Charles Leclerc on a mind that never switches off, the mental training he started at twelve, why he refuses to feel guilty about ten hours of sleep, and the seven-year story behind his bet on Eight Sleep.\",\"headline\":\"The quiet lap\",\"hero\":{\"alt\":\"Charles Leclerc seated for an interview portrait in a blue t-shirt against a studio backdrop\",\"name\":\"Charles Leclerc\",\"signatureAlt\":\"Charles Leclerc handwritten signature\",\"tagline\":\"Racing Driver\"},\"imageAlt\":{\"breakout\":\"Charles Leclerc photographed during his Eight Sleep Dreams interview\",\"column\":\"Charles Leclerc photographed for Eight Sleep\",\"fullBleed\":\"Charles Leclerc in a full-width editorial portrait\"},\"leadIn\":\"Charles Leclerc is the kind of person that seems constantly in motion, whether he’s racing, playing padel, piano, or chess, or dreaming up his next idea. And yet, the skill he has spent a lifetime learning isn’t how to go faster. It’s how to switch off.\",\"metadata\":{\"date\":\"June 18, 2026\",\"readTime\":\"4 min read\"},\"share\":{\"copyLink\":\"Copy link\",\"linkCopied\":\"Link copied\",\"shareOnFacebook\":\"Share on Facebook\",\"shareOnLinkedIn\":\"Share on LinkedIn\",\"shareOnX\":\"Share on X\"},\"video\":{\"ariaLabel\":\"Watch the interview with Charles Leclerc\",\"cta\":\"Watch the film\",\"modalAriaLabel\":\"Charles Leclerc Dreams interview\",\"previewAlt\":\"Charles Leclerc during his Eight Sleep interview\"}},\"emilyDiDonato\":{\"article\":{\"fullPicture\":{\"heading\":\"The full picture\",\"p1\":\"Sleep is the foundation of everything. Motherhood has layered it further. You stop sleeping well when you become a mother. You stop sleeping well when you’re pregnant. You stop sleeping well when you’re anxious about the person you’re supposed to become next.\",\"p2\":\"Nobody tells you how much pregnancy wrecks sleep. Emily is saying it now, because she’s been through it twice before and this time she had something different. The Pod tracking the changes she could feel but not name: temperature shifting, heart rate variability mapped in plain sight, biometric data that turned her body into something legible.\",\"p3\":\"“So much changes when you’re pregnant, and you can definitely feel that. But Eight Sleep helps you see it and map it out.”\"},\"growingIntoIcon\":{\"heading\":\"Growing into an icon\",\"p1\":\"The modeling career gave her a platform. It also gave her a long education in what it means to be a vessel for someone else’s vision. “As a model, you basically show up, you’re someone else’s chameleon, and you make someone else’s dream come true.” For years she was good at it. It paid. It opened doors. It took her to Thailand, to Paris, to shoots she’d remember thirty years from now. But it wasn’t hers.\",\"p2\":\"The shift into entrepreneurship came with a different weight. The freedom she’d wanted turned out to come with self-doubt she hadn’t anticipated. Imposter syndrome. The loss of a clear brief. “It’s much easier to be told what to do, how to be, what to look like.” Without that, she had to find out what she actually thought.\",\"p3\":\"She was told her value would decrease with age. That the industry had a shelf life and she was approaching it. She remembers feeling panicked at 29. Now she’s eight months pregnant, still building, still working, still, somehow, saying yes to projects that feel like her own.\",\"p4\":\"“The universe still continues to make my dreams come true,” she says, without irony.\"},\"intro\":{\"p1\":\"There is a version of Emily DiDonato that the world memorized: the Glamour editorial, the Maybelline campaigns across 13 years, the face in Times Square at 17 years old, still in high school, standing next to Christy Turlington on the biggest commercial shoot of her life. That version was real. It just wasn’t the whole story.\",\"p2\":\"“I just knew I wanted a life that was bigger than the one I was born into,” she says. She grew up in upstate New York, daughter of a New York City firefighter and a stay-at-home mom. She didn’t have a plan. She had a feeling. The two things are not the same, and she has spent her adult life learning the difference.\",\"p3\":\"The modeling career arrived before she had time to want it. A Glamour shoot in her senior year of high school, pulled from the Jersey Shore mid-vacation for a fitting she didn’t know would change everything. Maybelline saw that editorial. Called her in. And Emily, who had barely modeled before, found herself inside a machine she didn’t fully understand and couldn’t slow down.\",\"p4\":\"For years she ran on almost nothing. Red-eyes between jobs. Catching sleep wherever she could, on planes, in cars, in hotel rooms in cities she’d leave before she knew their names. “I remember thinking: this is so hard,” she says. “It was hard on my mental health. I needed days just to recover, lying in bed trying to catch up on sleep, which we all know you can’t actually do.”\",\"p5\":\"You can’t catch up. The science backs her up now. But at 17, 19, 22, she didn’t have the data. She had willpower and youth, and she spent both. The sleep solution that gives that recovery back didn’t exist yet.\"}},\"bottomCTA\":{\"cta\":\"Learn more about the Pod\"},\"description\":\"Model. Mom. Entrepreneur. Emily DiDonato on her third pregnancy, the chapter still being written, and how the Pod finally made the changes legible.\",\"headline\":\"The chapter is \u003cbr\u003e\u003c/br\u003estill open\",\"hero\":{\"alt\":\"Emily DiDonato — Model, Mom, Entrepreneur\",\"name\":\"Emily DiDonato\",\"signatureAlt\":\"Emily DiDonato signature\",\"tagline\":\"Model, Mom, Entrepreneur\"},\"imageAlt\":\"Emily DiDonato\",\"leadIn\":\"Emily has spent a career being someone else’s vision — a model, a chameleon, a vessel for other people’s dreams. Now, eight months pregnant with her third child and building something of her own, she’s learning what it means to choose her own brief. It starts, she says, with sleep.\",\"metadata\":{\"date\":\"May 10, 2026\",\"readTime\":\"3 – 4 min read\"},\"share\":{\"copyLink\":\"Copy link\",\"linkCopied\":\"Link copied\",\"shareOnFacebook\":\"Share on Facebook\",\"shareOnLinkedIn\":\"Share on LinkedIn\",\"shareOnX\":\"Share on X\"},\"video\":{\"ariaLabel\":\"Watch the interview with Emily DiDonato\",\"cta\":\"Watch the interview\",\"modalAriaLabel\":\"Emily DiDonato interview\",\"previewAlt\":\"Emily DiDonato — preview\"}},\"federicoChingotto\":{\"article\":{\"click\":{\"heading\":\"The click\",\"p1\":\"For eight years, Fede competed at the highest level and did not win a title. Not for lack of effort. Not for lack of talent. Finals came. They slipped. The difference, he now understands, was almost entirely in the head.\",\"p2\":\"“One day something clicks. You start to feel more secure. When you reach that final, you’re a little calmer. You don’t fully understand it while it’s happening. But something changes.”\",\"p3\":\"The call that changed everything came while he was on his way to get a haircut.\",\"p4\":\"Alejandro Galán, former World No. 1 and five-time world champion, rang to propose a partnership. “I was walking out of the hairdresser and I stayed frozen. I wasn’t expecting it. Obviously it was my idea, I thought we could build something great together. But hearing it from him, like that, I was stunned.”\",\"p5\":\"Their first year together: 15 consecutive finals. Five titles. The click had arrived.\"},\"climb\":{\"heading\":\"The climb\",\"p1\":\"The path from Olavarría to the top of world padel was not linear. It required, among other things, sleeping in a car.\",\"p2\":\"When funds were short, Fede and his partner would drive to a tournament the night before, skip the hotel, and sleep in the car. They would wake up, drive to the venue, and compete. “I know a lot of service stations in Argentina,” he says, with something between pride and disbelief at the memory.\",\"p3\":\"To raise travel money, he played in rifas, fundraising draws, what the Spanish call tómbolas. Sponsors were scarce. The prize money at junior level did not cover costs. Every tournament was a calculation. A bad result meant the next tournament might not happen.\",\"p4\":\"“I knew I had one shot. Either it worked out or I went back to Argentina and padel would just be a hobby. I don’t think there’s a greater pressure than that, knowing you have one bullet to make your dream real.”\",\"p5\":\"In July 2016, he and his partner won a qualifying spot for a European circuit tournament in Alicante. They had two days of practice. They came through pre-qualifying, qualifying, and reached the round of 16, where they faced Paquito Navarro and Sanyo Gutiérrez, then ranked No. 12 in the world.\",\"p6\":\"“They were our idols. We had watched them on our phones. They beat us 6-0, 6-1 in 45 minutes. But that feeling, walking onto the main court with a full crowd, my heart was full. For us, reaching the round of 16 from pre-qualifying was a prize.”\"},\"dream\":{\"heading\":\"The dream\",\"p1\":\"“The dream is already happening. I am living it. I can help my family. I travel well to tournaments. I have the tools to perform. When things go badly, I think about sleeping in the car, about the rifas, about that one shot, and I am grateful. Immediately.”\"},\"nightBefore\":{\"heading\":\"The night before\",\"p1\":\"Fede plays over 90 official matches a year. The week runs Monday to Saturday, two sessions a day, physical work in the morning, padel in the afternoon. Seven to eight hours of training, daily.\",\"p2\":\"At that volume, sleep is not a luxury. It is a training variable.\",\"p3\":\"“Quality matters more than quantity. Sometimes you sleep nine or ten hours and still don’t feel rested. I’ve seen it in my data. The deep sleep phases, how you move through the night, that’s what matters.”\",\"p4\":\"The night before a final, the anxiety surfaces in a specific way. “I get hungry. Nervous eating. Now I know myself, I put fruit out so I’m not attacking the chocolate.”\",\"p5\":\"He turns off screens. He has two anchors. The first: fishing videos. A man with a GoPro, standing on a riverbank, waiting. “I am hyperactive. Nervous. And somehow, watching fishing, I go completely still. I can imagine I’m there with him. It puts me in another place.”\",\"p6\":\"The second: Dragon Ball. An episode or two. Then sleep.\",\"p7\":\"“Sport is almost entirely mental at high level. Even the reset after a loss, that’s mental. You can have a free week, but if your head hasn’t paused, it’s like you haven’t rested at all.”\"},\"origins\":{\"heading\":\"Origins\",\"p1\":\"Federico Chingotto grew up in Olavarría, a city of 100,000 in the Buenos Aires province where padel was not a sport but a language. His parents played. His cousin played on the street in front of the house. By five years old, Fede had a racket in his hand. He has not put it down since.\",\"p2\":\"“It got into my blood,” he says. “I feel it’s my life. When my head gets too full, going to train gives me life.”\",\"p3\":\"He is the only child of parents who gave him one clear message. On the door of his childhood bedroom they placed a phrase that has never left him: always try to be the best, never believe you are.\",\"p4\":\"“That phrase has marked me. It pushes me every day.”\"},\"pullQuote1\":\"“Sport is almost entirely mental at high level. Even the reset after a loss, that’s mental. You can have a free week, but if your head hasn’t paused, it’s like you haven’t rested at all.”\",\"pullQuote2\":\"“The quality of sleep is the most important thing. Deep sleep, all the stages — that’s what really matters.”\",\"recovery\":{\"heading\":\"Recovery as discipline\",\"p1\":\"Two or three years ago, Fede was not sleeping well. He is hyperactive by nature, his mind runs fast, even in the dark. He kept his phone close. He stayed up late. He compensated with long siestas because he was running a sleep deficit from the night before.\",\"p2\":\"“I was activating myself with everything, without realising it. I couldn’t rest. Then someone showed me the path, removing screens, red light in the evenings, things that help you wind down. And when you try it and feel the difference, you start to pay attention.”\",\"p3\":\"Now recovery is structured. After every match: communicate with family. Shower. Treatment with the physio, ideally before dinner. No exceptions. “That moment, it’s like the match never happened. The body resets. Then back in bed.”\",\"p4\":\"After a late match, sometimes finishing at 9 or 10pm, the adrenaline does not clear until 2 or 3am. The Pod by Eight Sleep holds him there. “I’m very hot in summertime. I set it cold, minus 2. It gives you that fresh feeling, you want to wrap up more. I feel the difference in recovery the next morning.”\"}},\"bottomCTA\":{\"cta\":\"Shop the Pod\"},\"description\":\"Federico Chingotto on the climb from a car park in Argentina to World No. 1, the night-before ritual, and why sleep is a training variable.\",\"headline\":\"The mind game\",\"hero\":{\"alt\":\"Federico Chingotto mid-swing on a padel court, wearing his Alpine F1 jersey, under stadium lights\",\"name\":\"Federico Chingotto\",\"signatureAlt\":\"Federico Chingotto handwritten signature\",\"tagline\":\"Professional Padel Player\"},\"imageAlt\":{\"click\":\"Federico Chingotto seated for an interview portrait, wearing a white t-shirt against a plain studio backdrop\",\"tablet\":\"Federico Chingotto reviewing his sleep performance data on a tablet, with Eight Sleep's personalized performance windows for ideal focus and workout times highlighted\",\"tryptych\":\"Three court shots of Federico Chingotto — mid-swing under stadium lights, wearing his Eight Sleep training jersey from behind, and in mid-rally during a match\"},\"leadIn\":\"There is a version of Federico Chingotto the world has come to know. The explosive right-side player. The relentless retriever. One of the best in the world. But his story starts somewhere else entirely: a car park in Argentina, 3am, waiting for a tournament to begin.\",\"metadata\":{\"date\":\"May 27, 2026\",\"readTime\":\"5–7 min read\"},\"share\":{\"copyLink\":\"Copy link\",\"linkCopied\":\"Link copied\",\"shar ription\":\"Your offer is a click away\",\"subtitle\":\"Enter your phone number to get texts, and receive {totalDiscount} off the Pod.\",\"title\":\"Get texts to unlock savings\"},\"placeholders\":{\"email\":\"Email *\",\"phone\":\"Phone number\"}},\"faq\":{\"autopilot\":{\"item1\":{\"answer\":\"The Pod needs Autopilot to ensure sleepers experience optimal sleep stages by adjusting bed temperature and elevation throughout the night. This is crucial because a key factor for poor sleep is maintaining the wrong temperature. Autopilot aims to match your body's natural circadian rhythm and temperature needs for each sleep stage, enhancing the quality of deep and REM sleep.\",\"question\":\"Why does the Pod need Autopilot?\"},\"item2\":{\"answer\":\"Autopilot is required for the first 12 months (cancel any time), and covers two separate users per Pod.\",\"question\":\"Can I buy the Pod without Autopilot?\"},\"item3\":{\"answer\":\"Autopilot comes in annual plans and is billed once yearly.\",\"question\":\"What is the commitment length for Autopilot?\"},\"item4\":{\"answer\":\"If one partner has Autopilot, they can add a partner, for free so they can both enjoy the better sleep that comes with Autopilot.\",\"question\":\"Do I need to get Autopilot for both sides of the bed?\"}},\"availablePartners\":{\"answer\":{\"line1\":\"The following partners offer exclusive discounts as a member perk: Hyperice, Remedy Place, Equinox Spa, Plunge, Levels, Beam, Inside Tracker, Rootine, Prenuvo and Hydrow.\",\"line2\":\"The program is currently only available for US residents.\"},\"question\":\"Which partners are available through member perks?\"},\"baseExisting\":{\"answer\":\"Designed to fit between your current bed frame and your mattress, the Base does not replace your current setup. It is compatible with slatted and platform bed frames and foundations.\",\"question\":\"Does the Base of Pod 4 Ultra fit into my existing bed setup?\"},\"canICancel\":{\"answer\":{\"line1\":\"You can cancel your membership, but you will still be charged for the 12 months and have access to the features until the end of your first billing cycle.\",\"line2\":\"After you cancel your membership, you will lose access to the intelligent features of the Pod, such as automatic temperature adjustments, sleep and health insights, and the vibration and thermal alarm.\"},\"question\":\"Can I cancel my membership?\"},\"canICancelAB\":{\"answer\":{\"line1\":\"You can cancel your Autopilot, but you will still be charged for the 12 months and have access to the features until the end of your first billing cycle.\",\"line2\":\"After you cancel your Autopilot, you will lose access to the intelligent features of the Pod, such as automatic temperature adjustments, sleep and health insights, and the vibration and thermal alarm.\"},\"question\":\"Can I cancel my Autopilot?\"},\"couples\":{\"item1\":{\"answer\":\"The Pod is built to maintain the comfort of your current mattress.\",\"question\":\"Will I feel the Pod under me?\"},\"item2\":{\"answer\":\"The Pod runs quietly in the background. Most people don't notice it at all, even when temperature or elevation adjusts during the night.\",\"question\":\"Does the Pod make noise?\"},\"item3\":{\"answer\":\"Yes. Each side of the bed has its own temperature, alarm, and settings. You can personalize everything without affecting your partner's side.\",\"question\":\"Can we each control our own side?\"},\"item4\":{\"answer\":\"The Pod Cover works with all mattresses. The Pod Cover gets added to your mattress like a fitted sheet and maintains the comfort of your current mattress.\",\"question\":\"Do we need a new mattress?\"},\"item5\":{\"answer\":\"The Pod is designed for that. You can set separate wake-up times and routines for each side of the bed.\",\"question\":\"What if we have different sleep schedules?\"},\"item6\":{\"answer\":\"Yes. You can activate just one side of the Pod for temperature regulation.\",\"question\":\"If my partner doesn't want to use the Pod, can we only turn on one side?\"}},\"couples2026\":{\"comfortable\":{\"answer\":\"Yes. The Pod Cover is designed to be imperceptible to the touch.\",\"question\":\"Is the Pod comfortable?\"},\"differentTemps\":{\"answer\":\"That's exactly what the Pod is for. Each side adjusts independently from 55°F to 110°F.\",\"question\":\"What if my partner and I want different temperatures?\"},\"fitsMattress\":{\"answer\":\"Yes. The Pod Cover fits over any mattress like a fitted sheet. Keep your mattress, your frame, your sheets. *\",\"question\":\"Does the Pod work on my mattress?\"},\"hsaFsa\":{\"answer\":\"Yes. The Pod is HSA/FSA eligible.\",\"question\":\"Is it covered by HSA/FSA?\"},\"noWearable\":{\"answer\":\"Biometric sensors built into the Cover detect your heart rate, HRV, breathing, and movement while you sleep, no watch, ring, or band required. Just get into bed. The Pod does the rest.\",\"question\":\"How does the Pod track my sleep without a wearable?\"},\"riskFree\":{\"answer\":\"Yes. You get 30 nights. If you don't love it, return it for a full refund. Free shipping both ways.\",\"question\":\"Can I try it risk-free?\"},\"vsCoolingPad\":{\"answer\":\"Cooling pads use fans that fade in hours. The Pod uses active water-based cooling that lasts all night, adjusts automatically, and works differently on each side of the bed.\",\"question\":\"How is the Pod different from a cooling mattress pad?\"}},\"coverPDP\":{\"alreadyOwn\":{\"answer\":{\"line1\":\"If you already have an existing Pod you do not need to pay for another subscription. You can purchase a new Pod through the member shop in the Eight Sleep app or contact us at\",\"linkText\":\"support@eightsleep.com\",\"period\":\".\"},\"question\":\"I already own a Pod?\"},\"baseFit\":{\"answer\":\"Designed to fit between your current bed frame and your mattress, the Base does not replace your current setup. It is compatible with slatted and platform bed frames and foundations.\",\"question\":\ use the optional leg kit to use the Base in place of a bed frame.\",\"question\":\"Do I need the leg kit for Pod 4 Ultra?\"},\"noMembership\":{\"answer\":{\"and\":\"and\",\"automaticTempAdjustments\":\"automatic temperature adjustments\",\"continuousSoftwareUpdates\":\"continuous software updates\",\"line1\":\"A membership is required for the first 12 months, and the cost covers two separate users per Pod.\",\"line2\":\"The membership is what turns your Pod into an intelligent sleep system with features such as\",\"line3\":\". This personalizes the temperature of each side of the bed based on each individual's sleep schedule, sleep phases, comfort preferences, and environmental conditions.\",\"line4\":\"The membership also includes a\",\"period\":\".\",\"sleepHealthReports\":\"sleep \u0026 health reports\",\"vibrationThermalAlarm\":\"vibration \u0026 thermal alarm\"},\"question\":\"What does a credit check look like for Affirm?\"},\"payment\":{\"answer\":\"Affirm reminds you of upcoming payments via text and email. You can pay using ACH transfer, debit card, or check.\",\"question\":\"How do I make a payment?\"},\"paymentAlt\":{\"answer\":\"Payments are automatically withdrawn from your chosen payment method according to the agreed schedule. Early payments are always welcome.\",\"question\":\"How do I make a payment?\"},\"payOverTime\":{\"answer\":\"Look for the Affirm icon near the product price on the relevant page. To finance multiple items, all products in your cart must be financing-eligible. Select 'Pay with Affirm' during checkout.\",\"question\":\"How do I check eligibility?\"},\"payOverTimeAlt\":{\"answer\":\"Look for the Klarna icon near the product price on the relevant page. To finance multiple items, all products in your cart must be financing-eligible. Select 'Pay with Klarna' during checkout.\",\"question\":\"How do I check eligibility?\"},\"returnPolicy\":{\"answer\":\"If you return an item financed with Affirm, any payments made will be credited back to your original form of payment up to the refund amount (minus interest). Contact Eight Sleep to initiate a return, and we'll notify Affirm for credit adjustments.\",\"question\":\"What if I want to return my purchase?\"},\"returnPolicyAlt\":{\"answer\":\" If you return an item financed with Klarna, any payments made will be credited back to your original form of payment up to the refund amount. Contact Eight Sleep to initiate a return, and we'll notify Klarna for adjustments.\",\"question\":\"What if I want to return my purchase?\"},\"showroom\":{\"answer\":{\"line1\":\"While Eight Sleep doesn't have a dedicated showroom in Mexico, you can experience the Pod in person at ALBA Estudio de Interiores, an official Eight Sleep partner in Mexico City.\",\"line2\":\"Address: Prolongación Paseo de la Reforma 799, Oficina 504, Santa Fe, 01219 CDMX\",\"line3\":\"Visits by appointment only.\",\"line4\":\"Email: contacto@albaestudio.com.\",\"line5\":\"WhatsApp: +52 56 1257 2900\"},\"question\":\"Do you have a showroom?\"},\"warranty\":{\"answer\":{\"extendedWarrantyDescription\":{\"line1\":\"For up to 5 years following your initial purchase date, we will replace your Pod device as long as you purchased directly through Eight Sleep and are an active Enhanced member (\",\"line2\":\") if you have any issues or problems. (\",\"line3\":\")\",\"linkText\":\"see membership plans\",\"linkText2\":\"terms apply\"},\"extendedWarrantyTitle\":\"Extended warranty\",\"standardWarrantyDescription\":{\"line1\":\"The Pod is a product designed to be slept on every night – and designed to last. We stand behind our product with a 2-year limited warranty, meaning if you have any issues or problems, our team will replace your Pod device as long as you purchased directly through Eight Sleep and have an active membership. (\",\"line2\":\")\",\"linkText\":\"terms apply\"},\"standardWarrantyTitle\":\"Standard warranty\"},\"question\":\"How do I contact my financing company?\"},\"whyMembership\":{\"answer\":\"Affirm's longer-term financing options may involve interest charges. The exact monthly payment amount, including any interest, will be displayed upfront before you confirm your financing.\",\"question\":\"Are there financing fees?\"},\"whyMembershipAlt\":{\"answer\":\"Klarna is interest-free.\",\"question\":\"Are there financing fees?\"}},\"currentMattress\":{\"answer\":\"Yes, the Cover fits over your existing mattress similar to a fitted sheet.\",\"question\":\"Can I use the Pod if I want to keep my current mattress?\"},\"doesItFitMyBed\":{\"answer\":\"Yes, the Pod 4 and Pod 4 Ultra will seamlessly integrate with your current mattress and bed frame. Both products come with a Cover that fits on any mattress and a Hub that can fit next to your bed. Pod 4 Ultra comes with a Base that slots into your existing bed frame and beneath your mattress.\",\"question\":\"Does the Pod fit into my existing bed setup?\"},\"doINeedTwoMemberships\":{\"answer\":{\"email\":\"support@eightsleep.com\",\"line1\":\"If you already have an existing Pod you do not need to pay for another subscription. You can purchase a new Pod through the member shop in the Eight Sleep app or contact us at\",\"period\":\".\"},\"question\":\"I already own a Pod?\"},\"financing\":{\"answer\":{\"line1\":\"Financing is available in the U.S. through Affirm, with plans starting at 0% APR. Click\",\"line2\":\"to pre-qualify, or choose Affirm at checkout as your payment method.\",\"linkText\":\" here\"},\"question\":\"Can I finance my purchase?\"},\"hoox\":{\"coolWarm\":{\"answer\":\"Set each side of the bed between 55°F - 110°F. Schedule personalized temperatures for each phase of the night.\",\"question\":\"How cool or warm does the Pod get?\"},\"currentBed\":{\"answer\":\"Yes! The Cover fits seamlessly onto any bed.\",\"question\":\"Can I use the Pod on my current bed?\"},\"finance\":{\"answer\":\"Yes! We offer financing on the Cover with options as low as 0% APR. Choose Affirm at checkout to learn more.\",\"question\":\"Can I finance my purchase?\"},\"setup\":{\"answer\":\"Everything you need to add the Pod to your bed is included in your purchase. During first setup, you'll need to add distilled water and hydrogen peroxide to your hub.\",\"question\":\"What do I need to setup the Pod?\"},\"sizesDimensions\":{\"answer\":{\"caliKing\":\"- Cali King Size is 70.5 x 83.5 x 12 inches\",\"full\":\"- Full Size is 54 x 75 x 12 inches\",\"king\":\"- King Size is 74.5 x 79.5 x 12 inches\",\"queen\":\"- Queen Size is 58.5 x 79.5 x 12 inches\"},\"question\":\"What sizes \u0026 dimensions does the Pod come in?\"},\"trialWarranty\":{\"answer\":\"The Cover comes with a 30 night free-trial or full refund, 2 year warranty, and is currently available in continental US (excluding Hawaii, Alaska and Puerto Rico).\",\"question\":\"What's the trial and warranty policy?\"}},\"howDoesItImproveMySleep\":{\"answer\":\"One of the primary reasons people wake up during the night is temperature-related discomfort. The body needs different temperatures throughout the night to stay asleep, especially during REM cycles. Therefore, the Pod's ability to dynamically cool and heat based on current body temperatures allows you to sleep deeper and for longer. For those who snore, the elevation feature of the Pod 4 Ultra automatically raise your head to mitigate snoring and the sleep interruptions that result from it.\",\"question\":\"How does the Pod improve my sleep?\"},\"howDoesItReduceSnoring\":{\"answer\":{\"line1\":\"The Base of the Pod 4 Ultra gently elevates the bed when snoring is detected – in real time and without disruption. Pod 4 Ultra makes adjustments instantly once snoring is detected, reducing risk of waking up for both the person snoring and their partner. In a clinical study, participants who slept on the Pod 4 Ultra, decreased their snoring by 45%\",\"linkText\":\"(link to study)\",\"period\":\".\"},\"question\":\"How does the Pod reduce snoring?\"},\"howDoesItRegulateTemperature\":{\"answer\":\"The Pod adjusts the temperature of your bed surface through the Cover that fits over your mattress, which heats and cools your body through intelligent temperature adjustments. You can select the baseline temperature that works best for you, and the Pod will make micro adjustments to help you sleep longer and more deeply. It can cool as low as 55º F (12.8º C) and heat as high as 110º F (43.3º C).\",\"question\":\"How does the Pod regulate temperature?\"},\"huberman\":{\"applicationsClose\":{\"answer\":\"Applications will close on September 20th, at 11:59 PM EST.\",\"question\":\"When do applications close?\"},\"eligible\":{\"answer\":\"Eligible participants must be over 18 years-old.\",\"question\":\"Who is eligible to win?\"},\"howManyWinners\":{\"answer\":\"Two winners will be awarded two tickets each.\",\"question\":\"How many winners will be awarded?\"},\"prizeIncluded\":{\"answer\":\"Two VIP tickets that include premium seats, early venue access, and two autographed merchandise items.\",\"question\":\"What is included in the prize?\"},\"winnersNotified\":{\"answer\":\"Winners will be notified by September 21st, at 11:00 AM EST.\",\"question\":\"When will winners be notified?\"}},\"insert\":{\"item1\":{\"answer\":\"To maintain your Pod operating at its best and within warranty, we suggest the use of the maintenance insert. Before shipping to your home, your Pod was already pre-conditioned with a treatment that includes the maintenance solution, to ensure optimal performance for the next 6-8 months. There is no need to remove the current insert, adjust it, or add any other liquids other than water into the tank. Within 6-8 months of installation, you will receive your first delivery of a new maintenance insert and instructions on installing it.\",\"question\":\"I just bought a Pod, and I see I get maintenance insert deliveries with my Autopilot. What is it?\"},\"item2\":{\"answer\":\"The solution's active ingredients include benzalkonium chloride to keep the water clean and avoid performance issues.\",\"question\":\"What is in the maintenance solution for the Pod?\"},\"item3\":{\"answer\":\"The maintenance insert is a new feature available only on Pod 4 and newer units. Older Pods do not include an interchangeable insert and are not compatible with the new maintenance inserts. Only owners of these models with active Autopilot memberships will receive the maintenance inserts.\",\"question\":\"I upgraded to a newer Pod and have an older Pod generation. Do I need to change the insert for my older Pod as well?\"},\"item4\":{\"answer\":\"If you choose not to swap in your new inserts, your Pod could experience issues if any component degrades over time. This can cause a reduction in performance for temperature regulation and other features.\",\"question\":\"Will my Pod be damaged if I don't use the solution?\"},\"item5\":{\"answer\":{\"step1\":\"Locate the maintenance insert on the Cover's water cord.\",\"step2\":\"Press the button to remove your current insert. It is normal to see a few drops of water when removing.\",\"step3\":\"Remove your new insert from the box and slide the cap off.\",\"step4\":\"Insert your new insert into the adapter section of your Cover's water cord.\"},\"question\":\"How do I install the new insert every 6-8 months?\"},\"item6\":{\"answer\":\"In the near future, you'll be able to purchase maintenance inserts in the Member Shop to keep your hardware at peak performance without Autopilot.\",\"question\":\"If I cancel my Autopilot plan for my Pod, what do I do for maintenance?\"}},\"isItComfortable\":{\"answer\":\"The comfort of your current mattress is maintained when you use the Pod. To install the Pod, you will add a thin cover to your existing mattress, like a fitted sheet. This Cover is responsible for the dynamic heating and cooling of your body temperature, keeping you asleep longer through the night.\",\"question\":\"Is the Pod comfortable?\"},\"jetLag\":{\"allergiesDietary\":{\"answer\":\"Jet Lag Supplement is plant-based and vegan-friendly. If you have specific sensitivities, review the ingredient list carefully and consult your healthcare provider.\",\"question\":\"Can I take Jet Lag Supplement if I have allergies or dietary restrictions?\"},\"avoidWhileTaking\":{\"answer\":\"Avoid combining Jet Lag Supplement with alcohol or other sleep medications, as this may increase drowsiness. Do not drive or operate heavy machinery within 4-5 hours of taking Jet Lag Supplement. If you're taking medications for blood pressure, diabetes, or blood thinning, consult your healthcare provider before use.\",\"question\":\"Is there anything I should avoid doing while taking the supplement? (e.g. alcohol)\"},\"howDifferent\":{\"answer\":\"Most jet lag supplements rely only on melatonin, often in high doses. Jet Lag Supplement combines a gentle melatonin dose with phosphatidylserine, which helps support relaxation and stress management. This dual formula is designed to realign your body clock without next-day grogginess.\",\"question\":\"How is this different from other jet lag supplements?\"},\"moreThan3Capsules\":{\"answer\":\"The maximum recommended dose is 3 capsules per night. Taking more may cause unwanted side effects like excessive grogginess or digestive upset.\",\"question\":\"Can I take more than 3 capsules per night?\"},\"onlyUS\":{\"answer\":\"Yes, currently Jet Lag is only available to ship to customers in the US (excluding Alaska, Hawaii, Puerto Rico and other US territories).\",\"question\":\"Is Jet Lag only available in the US?\"},\"returnHome\":{\"answer\":\"Yes. Taking Jet Lag Supplement at your normal home bedtime can help you readjust to your home time zone. If you're still having sleep issues after a week at home, consider consulting a healthcare provider rather than continuing the supplement indefinitely.\",\"question\":\"Should I take it when I return home too?\"},\"safeForFrequentUse\":{\"answer\":\"Jet Lag Supplement contains low-dose melatonin and phosphatidylserine, which are both considered safe for short-term, intermittent use. It's designed for travel, but is not intended as a nightly, long-term sleep aid. If you need ongoing sleep support, consult a healthcare professional.\",\"question\":\"Is it safe for frequent use?\"},\"sleepDisorder\":{\"answer\":\"If you have a diagnosed sleep disorder (such as insomnia, sleep apnea, or restless legs syndrome), consult your doctor before use. Jet Lag Supplement is intended for healthy adults experiencing temporary jet lag, not as a treatment for medical sleep conditions.\",\"question\":\"Can I take Jet Lag Supplement if I have a sleep disorder?\"},\"testing\":{\"answer\":{\"item1\":\"NSF Certified for Sport\",\"item2\":\"Third-party tested for purity and accuracy of dosage\",\"item3\":\"Produced under Good Manufacturing Practices (GMP) for safety and consistency\"},\"question\":\"What testing do you do on Jet Lag Supplement?\"},\"whenToTake\":{\"answer\":{\"line1\":\"Take Jet Lag Supplement 30–60 minutes before your desired bedtime at the new location. For the most effective use, follow the personalized Jet Lag Protocol in the Eight Sleep app.\",\"longHaulDay1\":\"Day 1: Take 3 capsules\",\"longHaulDay2\":\"Day 2: Take 2 capsules\",\"longHaulDay3\":\"Day 3: Take 1 capsule (continue nightly if needed)\",\"longHaulTitle\":\"For long-haul travel (over 3 time zones):\",\"shortHaulDay1\":\"Day 1: 2 capsules\",\"shortHaulDay2\":\"Day 2: Continue with 1 capsule nightly if needed\",\"shortHaulTitle\":\"For short-haul travel (1–3 time zones):\"},\"question\":\"When should I take Jet Lag Supplement?\"},\"whoIsItFor\":{\"answer\":\"Jet Lag Supplement is designed for travelers who want support adjusting to new time zones. It's especially useful if you're flying across multiple time zones and want to minimize jet lag and shift your sleep schedule.\",\"question\":\"Who is Jet Lag Supplement for?\"}},\"memberAnniversaryUpgrade\":{\"anotherRoom\":{\"answer\":\"Yes, you can install your Active Grid on a bed in another room, but you will need to purchase an additional Encasement for it. Contact our Sleep Pros to purchase.\",\"question\":\"Can I install my current Pod in another room?\"},\"dataPreferences\":{\"answer\":\"All of your existing Eight Sleep data and preferences will be saved with your current Eight Sleep account.\",\"question\":\"What happens to all my Eight Sleep data and temperature preferences?\"},\"differentSize\":{\"answer\":\"You can buy an upgrade bundle with the specific size you would like to upgrade to, and then purchase an encasement and/or mattress for your new bed size separately. For example, if you have a queen-sized Pod and would like to upgrade to a king-size, select the king–sized member upgrade and purchase a king-sized mattress as well. Contact our Sleep Pros to purchase.\",\"question\":\"I want to buy a Pod that is a different size from my current Pod, how do I upgrade? \"},\"financing\":{\"answer\":\"If you are currently financing a 1st or 2nd generation Pod, your financing payments will continue separately of your upgrade. If you choose to finance your Pod 3 Upgrade, then you will need to take out a new loan separately.\",\"question\":\"What happens if I am still paying a financing loan for my current Pod?\"},\"multipleBundles\":{\"answer\":\"Yes - you can purchase more than one upgrade bundle, but they will not include the mattress or encasement. Contact our Sleep Pros to purchase.\",\"question\":\"Can I purchase more than one discounted upgrade bundle? \"},\"warranty\":{\"answer\":\"With your purchase of a Pod 3 you will receive a new warranty that kicks off with this new product purchase. The warranty for Pod 3 is of 2 years (Active Grid and Hub only).\",\"question\":\"Does my current warranty extend when I purchase an upgrade?\"}},\"membershipFaqItem\":{\"answer\":{\"line1\":\"If you already have an existing Pod you do not need to pay for another subscription. Simply use the same email address when setting up your new Pod and your subscription will automatically carry over.\",\"line2\":\"to proceed without selecting an additional subscription.\",\"linkText\":\"Click here\"},\"question\":\"I already own a Pod?\"},\"memberShop\":{\"item1\":{\"answer\":\"To use the Blanket, you'll need to pair it with a Pod 5 Cover.\",\"question\":\"Can I add the Blanket to my existing Pod?\"},\"item10\":{\"answer\":\"No returns needed. Keep your old Pod and repurpose it in a guest room, move it to a second home, or gift it to friends or family.\",\"question\":\"Is there a trade-in or buyback program for my old Pod?\"},\"item11\":{\"answer\":{\"line1\":\"You can change your plan by going to the app and following these steps:\",\"step1\":\"Navigate to the menu (upper right corner)\",\"step2\":\"Click on \\\"Profile\\\"\",\"step3\":\"Scroll down and select \\\"Manage Autopilot plan\\\"\",\"step4\":\"Select your plan\"},\"question\":\"How and where can I change my Autopilot plan?\"},\"item12\":{\"answer\":{\"line1\":\"Health Check is included with the Elite Autopilot tier. It is a new AI-powered feature that detects abnormalities in your vital signs and delivers a report in the Eight Sleep app, helping you to take early action.\",\"line2\":\"Anyone with any previous Pod generation can access the Health Check feature if they choose the Elite Autopilot plan. You can upgrade to new Elite Autopilot plan by navigating to the app and following the steps below:\",\"line3\":\"If you purchased a Pod before January 1, 2022, Health Check is already included in your membership.\",\"step1\":\"Navigate to the menu (upper right corner)\",\"step2\":\"Click \\\"Profile\\\"\",\"step3\":\"Scroll down and select \\\"Manage Autopilot plan\\\"\",\"step4\":\"Select \\\"Elite w/ Health Check\\\" plan\"},\"question\":\"What is Health Check and how can I get access?\"},\"item13\":{\"answer\":\"Your membership can be upgraded any time through the app and your billing will adjust automatically. Similar
