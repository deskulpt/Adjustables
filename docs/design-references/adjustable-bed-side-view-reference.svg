<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-labelledby="ref-title">
  <title id="ref-title">Adjustable bed side-view reference — head and foot sections lift upward from a flat baseline at the waist hinge</title>
  <text x="210" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#46586e">Side view (reference): sections pivot at waist; elevated ends move up, not down</text>
  <line x1="40" y1="155" x2="380" y2="155" stroke="#101b2b" stroke-width="2"/>
  <text x="210" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#46586e">Floor / flat baseline</text>
  <circle cx="210" cy="155" r="7" fill="#b8873f" stroke="#101b2b"/>
  <text x="210" y="142" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#2c6fa8">Waist hinge</text>
  <!-- Flat ghost -->
  <rect x="50" y="118" width="160" height="16" fill="#e8e4dc" stroke="#101b2b" opacity="0.35"/>
  <rect x="210" y="118" width="160" height="16" fill="#e8e4dc" stroke="#101b2b" opacity="0.35"/>
  <!-- Elevated position (example) -->
  <g transform="translate(210 155)">
    <g transform="rotate(-38)">
      <rect x="-160" y="-34" width="160" height="16" fill="#faf7f0" stroke="#101b2b"/>
      <text x="-80" y="-42" text-anchor="middle" font-size="10" fill="#101b2b">Head section ↑</text>
    </g>
    <g transform="rotate(-14)">
      <rect x="0" y="-34" width="160" height="16" fill="#faf7f0" stroke="#101b2b"/>
      <text x="80" y="-42" text-anchor="middle" font-size="10" fill="#101b2b">Foot section ↑</text>
    </g>
  </g>
  <text x="48" y="108" font-size="11" fill="#46586e">HEAD</text>
  <text x="352" y="108" font-size="11" fill="#46586e">FOOT</text>
</svg>
