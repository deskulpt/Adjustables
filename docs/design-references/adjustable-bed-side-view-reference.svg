<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-labelledby="ref-title">
  <title id="ref-title">Split adjustable base: head and foot sections lift on hinges; middle deck stays flat on the base</title>
  <text x="210" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#46586e">4 joint points · middle section fixed to base</text>
  <line x1="40" y1="150" x2="380" y2="150" stroke="#101b2b" stroke-width="2"/>
  <rect x="165" y="142" width="90" height="8" fill="#101b2b"/>
  <rect x="165" y="118" width="90" height="20" fill="#e4ddd1" stroke="#101b2b"/>
  <text x="210" y="110" text-anchor="middle" font-size="10" fill="#2c6fa8">Middle (flat on base)</text>
  <g transform="translate(165 150)">
    <g transform="rotate(-36)">
      <rect x="-125" y="-34" width="125" height="16" fill="#faf7f0" stroke="#101b2b"/>
      <circle cx="-125" cy="-26" r="5" fill="#2c6fa8"/>
      <circle cx="0" cy="0" r="6" fill="#fbfaf8" stroke="#b8873f" stroke-width="2"/>
      <text x="-62" y="-42" text-anchor="middle" font-size="10">Head ↑</text>
    </g>
  </g>
  <g transform="translate(255 150)">
    <g transform="rotate(-12)">
      <rect x="0" y="-34" width="125" height="16" fill="#faf7f0" stroke="#101b2b"/>
      <circle cx="125" cy="-26" r="5" fill="#2c6fa8"/>
      <circle cx="0" cy="0" r="6" fill="#fbfaf8" stroke="#b8873f" stroke-width="2"/>
      <text x="62" y="-42" text-anchor="middle" font-size="10">Foot ↑</text>
    </g>
  </g>
  <text x="52" y="104" font-size="11">HEAD END</text>
  <text x="328" y="104" font-size="11">FOOT END</text>
  <text x="150" y="172" font-size="10" fill="#46586e">Head hinge</text>
  <text x="255" y="172" font-size="10" fill="#46586e">Foot hinge</text>
</svg>
